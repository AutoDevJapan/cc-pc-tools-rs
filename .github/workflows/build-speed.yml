name: Build speed
on:
  push:
    branches: [main]
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/build-speed.yml', '.config/nextest.toml']
  pull_request:
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/build-speed.yml', '.config/nextest.toml']
# Superseded PR heads need no second verification; preserve every main run.
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
permissions:
  contents: read
jobs:
  cc-jobs:
    # The cargo gate, its locks and the process tests are Windows only.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: cargo nextest run --locked --workspace --no-fail-fast --test-threads 10
      - run: cargo test --locked --workspace --doc -- --test-threads=10
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  package-tools:
    # Only this finite repair needs downloadable PC binaries; do not grow storage on every PR.
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'fix/todo1139-timed-retry' || github.event.pull_request.head.ref == 'fix/console-todo-capacity-1460' || github.event.pull_request.head.ref == 'fix/question-state-capacity-2444') && github.event.pull_request.head.repo.full_name == github.repository
    needs: cc-jobs
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p cc-todo -p cc-jobs -p cc-scheduler -p cc-ask -p localai-web-rs --bins
      - name: Record the exact checked-out source and binary hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Checked-out source differs from the fixed source revision' }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $tree -notmatch '^[0-9a-f]{40}$') { throw 'Source tree is unavailable' }
          $files = foreach ($name in @('todo.exe', 'codex_jobs.exe', 'scheduler.exe', 'discord_ask.exe', 'localai-web-rs.exe')) {
            $path = Join-Path 'target/release' $name
            $file = Get-Item -LiteralPath $path
            @{ name = $name; bytes = $file.Length; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
          }
          @{ revision = $revision; tree = $tree; run_id = $env:GITHUB_RUN_ID; files = @($files) } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath target/release/tools-manifest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tools-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            target/release/todo.exe
            target/release/codex_jobs.exe
            target/release/scheduler.exe
            target/release/discord_ask.exe
            target/release/localai-web-rs.exe
            target/release/tools-manifest.json
