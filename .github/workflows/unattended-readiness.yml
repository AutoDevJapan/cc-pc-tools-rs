name: Unattended readiness tools
env:
  CC_LINUX_RUNNER_MODE: normal
on:
  push:
    branches: [main]
    paths: ['resident-guard/**', 'capacity-audit-3h/**', 'unattended-runner/**', 'repair-guard/**', 'tools/civ6-ci-contract/**', 'localai-web-rs/src/operations_catalog.rs', 'localai-web-rs/src/operations.rs', 'tools/linux-runner-bridge/**', '.github/workflows/unattended-readiness.yml']
  pull_request:
    paths: ['resident-guard/**', 'capacity-audit-3h/**', 'unattended-runner/**', 'repair-guard/**', 'tools/civ6-ci-contract/**', 'localai-web-rs/src/operations_catalog.rs', 'localai-web-rs/src/operations.rs', 'tools/linux-runner-bridge/**', '.github/workflows/unattended-readiness.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  go:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [Windows, Linux]
        include:
          - os: Windows
            labels: [self-hosted, Windows, X64, cc-pc-tools-windows]
          - os: Linux
            labels: [self-hosted, Linux, X64, cc-pc-tools-linux]
        module: [resident-guard, capacity-audit-3h, unattended-runner, tools/linux-runner-bridge]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Admit current Windows source before checkout
        if: runner.os == 'Windows'
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use the Linux job work directory for Go compilation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/go-cache"
          printf 'TMPDIR=%s/go-tmp\nGOTMPDIR=%s/go-tmp\nGOCACHE=%s/go-cache\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache: false
      # The receiver retains a real 21-second subprocess-budget regression.
      # Cold Windows integration tests consumed 111s before that test began.
      # Bound this package separately, without shortening its runtime checks.
      - run: go test -race -timeout ${{ matrix.module == 'unattended-runner' && '180s' || '120s' }} ./...
      - run: go vet ./...
      - run: go build -trimpath .
  repair-guard:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, cc-pc-tools-windows]
    # The expanded guard suite includes 333 top-level tests and serial real-Git
    # lineage checks (one seven-product group takes several minutes). A 10m
    # job canceled it while tests were still progressing, before Go could emit
    # its own timeout trace. Keep all cases and a finite diagnostic deadline.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: repair-guard
    steps:
      - name: Admit current Windows source before checkout
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: repair-guard/go.mod
          cache: false
      - run: go run ./internal/cataloggen -check
      # The suite opens many real Git paths. Hashing those test-cache inputs
      # took another 323s after its 429s PASS on Windows. Always run the cases
      # and skip result-cache bookkeeping; the compilation cache stays enabled.
      - run: go test -count=1 -v -timeout 20m ./...
      - run: go vet ./...
      - run: go build -trimpath .
