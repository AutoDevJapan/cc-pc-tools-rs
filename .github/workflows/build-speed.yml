name: Build speed
on:
  push:
    branches: [main]
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'tools/linux-runner-bridge/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/build-speed.yml', '.config/nextest.toml']
  pull_request:
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'tools/linux-runner-bridge/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/build-speed.yml', '.config/nextest.toml']
# Superseded PR heads need no second verification; preserve every main run.
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
permissions:
  contents: read
jobs:
  cc-jobs:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # The cargo gate, its locks and the process tests are Windows only.
    runs-on: [self-hosted, Windows, X64, cc-pc-tools-windows]
    timeout-minutes: 90
    steps:
      - name: Admit current Windows source before checkout
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Verify the repaired isolated worktree fixture first
        run: cargo nextest run --locked -p cc-ask --test resume -E 'test(real_reply_shapes_after_reask_in_central_worktree)'
      - name: Verify owned process-tree cancellation before the full suite
        run: cargo nextest run --locked -p cc-jobs --test parity -E 'test(end_to_end::test_cancel_kills_the_whole_tree)'
      - name: Verify recovered job references and the explicit resume boundary first
        run: cargo nextest run --locked -p cc-todo --test job_references --test verified_resume
      - name: Verify dependency and cancellation identity boundaries before the full suite
        run: cargo nextest run --locked -p cc-jobs --test parity -E 'test(dependency_) | test(cancel::) | test(resume_refuses_a_lost_writer_when_its_identity_is_inaccessible_or_missing)' --no-fail-fast
      - name: Verify supervisor identity and final event drain before the full suite
        run: cargo nextest run --locked -p cc-jobs --test parity -E 'test(lost_detection::) | test(supervisor_drains_events_arriving_during_the_final_process_poll)' --no-fail-fast
      - run: cargo nextest run --locked --workspace --no-fail-fast --test-threads 10
      - run: cargo test --locked --workspace --doc -- --test-threads=10
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
  package-tools:
    # Only this finite repair needs downloadable PC binaries; do not grow storage on every PR.
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'fix/todo1139-timed-retry' || github.event.pull_request.head.ref == 'fix/console-todo-capacity-1460' || github.event.pull_request.head.ref == 'fix/question-state-capacity-2444') && github.event.pull_request.head.repo.full_name == github.repository
    needs: cc-jobs
    runs-on: [self-hosted, Windows, X64, cc-pc-tools-windows]
    timeout-minutes: 90
    steps:
      - name: Admit current Windows source before checkout
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - run: cargo build --locked --release --target-dir target -p cc-todo -p cc-jobs -p cc-scheduler -p cc-ask -p localai-web-rs --bins
      - name: Record the exact checked-out source and binary hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Checked-out source differs from the fixed source revision' }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $tree -notmatch '^[0-9a-f]{40}$') { throw 'Source tree is unavailable' }
          $files = foreach ($name in @('todo.exe', 'codex_jobs.exe', 'scheduler.exe', 'discord_ask.exe', 'localai-web-rs.exe')) {
            $path = Join-Path 'target/release' $name
            $file = Get-Item -LiteralPath $path
            @{ name = $name; bytes = $file.Length; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
          }
          @{ revision = $revision; tree = $tree; run_id = $env:GITHUB_RUN_ID; files = @($files) } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath target/release/tools-manifest.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-tools-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            target/release/todo.exe
            target/release/codex_jobs.exe
            target/release/scheduler.exe
            target/release/discord_ask.exe
            target/release/localai-web-rs.exe
            target/release/tools-manifest.json
