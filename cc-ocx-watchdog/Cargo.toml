[package]
name = "cc-ocx-watchdog"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[[bin]]
name = "ocx_health_watchdog"
path = "src/main.rs"

[[bin]]
name = "ocx_watchdog_fixture"
path = "src/bin/fixture.rs"
test = false
