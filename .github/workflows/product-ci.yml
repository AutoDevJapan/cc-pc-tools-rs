name: Product CI helper
env:
  CC_LINUX_RUNNER_MODE: normal
on:
  push:
    branches: [main]
    paths: ['tools/product-ci/**', '.github/workflows/product-ci.yml']
  pull_request:
    paths: ['tools/product-ci/**', '.github/workflows/product-ci.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  helper:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Windows
            labels: [self-hosted, Windows, X64, cc-pc-tools-windows]
          - os: Linux
            labels: [self-hosted, Linux, X64, cc-pc-tools-linux]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/product-ci
    steps:
      - name: Admit current Windows head before checkout
        if: runner.os == 'Windows'
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use job-owned Linux Go scratch
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/go-cache"
          printf 'TMPDIR=%s/go-tmp\nGOTMPDIR=%s/go-tmp\nGOCACHE=%s/go-cache\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        if: runner.os == 'Windows'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test -race -timeout 120s ./...
      - run: go vet ./...
      - run: go build -trimpath .
