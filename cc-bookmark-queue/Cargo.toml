[package]
name = "cc-bookmark-queue"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "bookmark_queue"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
