name: Desktop Build

# Unsigned CI artifacts only; one reviewed job per ephemeral PC runner.
permissions:
  contents: read
  actions: read
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: desktop-build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission:
    name: Desktop admission
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      build: ${{ steps.scope.outputs.build }}
      windows: ${{ steps.reuse.outputs.build || steps.scope.outputs.build }}
      reused_run: ${{ steps.reuse.outputs.run }}
      quality_run: ${{ steps.quality.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Determine affected desktop inputs
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          build=false
          if [[ "$EVENT" == workflow_dispatch ]]; then
            build=true
          elif [[ "$BASE_SHA" =~ ^0{40}$ ]]; then
            build=true
          else
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "$BASE_SHA^{commit}"
            git diff --no-renames --name-only -z "$BASE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/desktop-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                frontend/*|packages/extension/*|e2e/web/*|e2e/extension/*) ;;
                *) build=true ;;
              esac
            done < "$RUNNER_TEMP/desktop-paths"
          fi
          if [[ "$EVENT" == pull_request ]]; then build=false; fi
          printf 'build=%s\n' "$build" >> "$GITHUB_OUTPUT"
      - name: Require successful Quality Gate for the identical source
        if: steps.scope.outputs.build == 'true'
        id: quality
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = AutoDevJapan/PassShare
          repo="repos/$GITHUB_REPOSITORY"
          gh api "$repo" | jq -e '.id == 1131498455 and .owner.login == "AutoDevJapan" and .private == false and .default_branch == "main"'
          if [[ "$GITHUB_REF_NAME" != main ]]; then
            test "$EVENT" = workflow_dispatch
            test "$GITHUB_REF_NAME" = scheduler/todo-2994-passshare-windows
          fi
          tree=$(gh api "$repo/git/commits/$GITHUB_SHA" --jq .tree.sha)
          for n in {1..60}; do
            gh api --method GET "$repo/actions/workflows/quality-gate.yml/runs" -f head_sha="$GITHUB_SHA" -f per_page=100 > "$RUNNER_TEMP/desktop-quality-runs.json"
            jq -e '.total_count <= 100' "$RUNNER_TEMP/desktop-quality-runs.json"
            run=$(jq -c --arg sha "$GITHUB_SHA" --arg branch "$GITHUB_REF_NAME" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == $branch and .head_repository.id == 1131498455 and (.event == "push" or .event == "pull_request"))] | sort_by(.id) | last // {}' "$RUNNER_TEMP/desktop-quality-runs.json")
            state=$(jq -r '.status // "missing"' <<< "$run")
            if [[ "$state" == completed ]]; then
              test "$(jq -r .conclusion <<< "$run")" = success
              id=$(jq -r .id <<< "$run")
              attempt=$(jq -r .run_attempt <<< "$run")
              if [[ "$(jq -r .event <<< "$run")" == pull_request ]]; then
                pr=$(jq -r '.pull_requests | if length == 1 then .[0].number else error("ambiguous PR") end' <<< "$run")
                gh api "$repo/pulls/$pr" > "$RUNNER_TEMP/desktop-quality-pr.json"
                jq -e --arg sha "$GITHUB_SHA" '.state == "open" and .head.repo.id == 1131498455 and .base.repo.id == 1131498455 and .base.ref == "main" and .head.sha == $sha' "$RUNNER_TEMP/desktop-quality-pr.json"
                merge=$(jq -r .merge_commit_sha "$RUNNER_TEMP/desktop-quality-pr.json")
                test "$(gh api "$repo/git/commits/$merge" --jq .tree.sha)" = "$tree"
              else
                test "$GITHUB_REF_NAME" = main
              fi
              gh api "$repo/actions/runs/$id/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/desktop-quality-jobs.json"
              jq -e '.total_count == (.jobs | length) and ([.jobs[] | select(.name == "Desktop smoke" and .conclusion == "success")] | length) == 1 and ([.jobs[] | select(.name == "Quality gate" and .conclusion == "success")] | length) == 1 and ([.jobs[] | select(.name == "Change scope and inexpensive checks" and .conclusion == "success")] | length) == 1' "$RUNNER_TEMP/desktop-quality-jobs.json"
              printf 'run=%s\n' "$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo 'No successful identical-source Quality Gate within 30 minutes' >&2
          exit 1
      - name: Reuse the verified Windows bytes of an identical tree
        if: steps.scope.outputs.build == 'true'
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="repos/$GITHUB_REPOSITORY"
          tree=$(gh api "$repo/git/commits/$GITHUB_SHA" --jq .tree.sha)
          gh api "$repo/actions/workflows/desktop-build.yml/runs?status=success&per_page=30" > "$RUNNER_TEMP/desktop-prior.json"
          while IFS= read -r run; do
            id=$(jq -r .id <<< "$run")
            test "$id" != "$GITHUB_RUN_ID"
            sha=$(jq -r .head_sha <<< "$run")
            old_tree=$(gh api "$repo/git/commits/$sha" --jq .tree.sha)
            if [[ "$old_tree" != "$tree" ]]; then continue; fi
            attempt=$(jq -r .run_attempt <<< "$run")
            gh api "$repo/actions/runs/$id/attempts/$attempt/jobs?per_page=100" > "$RUNNER_TEMP/desktop-prior-jobs.json"
            jq -e '.total_count == (.jobs | length)' "$RUNNER_TEMP/desktop-prior-jobs.json"
            if ! jq -e '[.jobs[] | select(.name == "Windows build" and .conclusion == "success" and (.runner_name | test("^CC-PSW-[0-9a-f]{32}$")) and (.labels | index("passshare-ci-windows")))] | length == 1' "$RUNNER_TEMP/desktop-prior-jobs.json"; then continue; fi
            gh api "$repo/actions/runs/$id/artifacts?per_page=100" > "$RUNNER_TEMP/desktop-prior-artifacts.json"
            jq -e '.total_count == (.artifacts | length)' "$RUNNER_TEMP/desktop-prior-artifacts.json"
            artifact=$(jq -r --arg name "desktop-windows-$sha" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0].id else "" end' "$RUNNER_TEMP/desktop-prior-artifacts.json")
            if [[ -z "$artifact" ]]; then continue; fi
            dir="$RUNNER_TEMP/desktop-reuse-$id"
            mkdir "$dir"
            gh api "$repo/actions/artifacts/$artifact/zip" > "$dir.zip"
            unzip -q "$dir.zip" -d "$dir"
            manifest="$dir/manifest.json"
            jq -e --arg sha "$sha" --arg id "$id" --arg attempt "$attempt" '.source_sha == $sha and .run_id == $id and .attempt == $attempt and .signed == false and .rust_version == "1.95.0" and .node_version == "v22.16.0" and (.files | length > 0) and all(.files[]; (.name | test("^[A-Za-z0-9_. -]+$")) and (.sha256 | test("^[0-9a-f]{64}$")) and (.bytes > 0))' "$manifest"
            while IFS= read -r file; do
              name=$(jq -r .name <<< "$file")
              test "$(stat -c %s "$dir/$name")" = "$(jq -r .bytes <<< "$file")"
              test "$(sha256sum "$dir/$name" | cut -d ' ' -f 1)" = "$(jq -r .sha256 <<< "$file")"
            done < <(jq -c '.files[]' "$manifest")
            printf 'build=false\nrun=%s\n' "$id" >> "$GITHUB_OUTPUT"
            printf 'Windows artifacts reused from verified run %s, source %s, tree %s\n' "$id" "$sha" "$tree" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          done < <(jq -c '[.workflow_runs[] | select(.status == "completed" and .conclusion == "success" and .head_repository.id == 1131498455 and (.event == "push" or .event == "workflow_dispatch") and (.head_branch == "main" or .head_branch == "scheduler/todo-2994-passshare-windows"))] | sort_by(.id) | reverse | .[]' "$RUNNER_TEMP/desktop-prior.json")
          echo 'build=true' >> "$GITHUB_OUTPUT"

  windows:
    name: Windows build
    needs: admission
    if: needs.admission.outputs.windows == 'true'
    runs-on: [self-hosted, Windows, X64, passshare-ci-windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify fixed source before tools
        run: '& "$env:CIW_HELPER" verify-source "$env:CIW_ROOT"; if ($LASTEXITCODE) { exit $LASTEXITCODE }'
      - name: Verify prepared Rust and Node
        run: |
          rustc -vV
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((rustc --version) -notmatch '^rustc 1\.95\.0 ') { throw 'Unreviewed Rust toolchain' }
          node --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((node --version) -ne 'v22.16.0') { throw 'Unreviewed Node toolchain' }
          pnpm --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((pnpm --version) -ne '10.11.0') { throw 'Unreviewed pnpm toolchain' }
      - name: Install frontend dependencies
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir packages/connect-js run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          pnpm --dir apps/desktop install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run Windows desktop acceptance
        run: |
          cargo test --locked -p passshare-desktop --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
      - name: Record exact distribution bytes
        env:
          QUALITY_RUN: ${{ needs.admission.outputs.quality_run }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath "$env:CARGO_TARGET_DIR/release/passshare-desktop.exe")) { throw 'Application executable missing' }
          $out = Join-Path $env:RUNNER_TEMP 'passshare-artifacts'
          New-Item -ItemType Directory -Path $out | Out-Null
          $files = @(Get-ChildItem -LiteralPath "$env:CARGO_TARGET_DIR/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.exe','.msi' })
          if (!$files.Count) { throw 'No Windows distribution packages' }
          $files += Get-Item -LiteralPath "$env:CARGO_TARGET_DIR/release/passshare-desktop.exe"
          $rows = @()
          foreach ($file in $files) {
            $dest = Join-Path $out $file.Name
            if (Test-Path -LiteralPath $dest) { throw 'Duplicate artifact filename' }
            Copy-Item -LiteralPath $file.FullName -Destination $dest
            $sha = (Get-FileHash -LiteralPath $dest -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($sha -ne (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()) { throw 'Artifact copy differs' }
            $rows += @{name=$file.Name; bytes=$file.Length; sha256=$sha}
          }
          @{source_sha=$env:GITHUB_SHA; workflow_sha=$env:GITHUB_WORKFLOW_SHA; run_id=$env:GITHUB_RUN_ID; attempt=$env:GITHUB_RUN_ATTEMPT; job_key=$env:GITHUB_JOB; runner=$env:RUNNER_NAME; quality_run=$env:QUALITY_RUN; rust_version='1.95.0'; node_version='v22.16.0'; pnpm_version='10.11.0'; signed=$false; files=$rows} | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "$out/manifest.json" -Encoding utf8NoBOM
          Get-Content -LiteralPath "$out/manifest.json" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-windows-${{ github.sha }}
          path: ${{ runner.temp }}/passshare-artifacts/*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux build
    needs: admission
    if: needs.admission.outputs.build == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 10.11.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: |
            apps/desktop/pnpm-lock.yaml
            packages/connect-js/pnpm-lock.yaml
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: |
          pnpm --dir packages/connect-js install --frozen-lockfile
          pnpm --dir packages/connect-js run build
          pnpm --dir apps/desktop install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: apps/desktop
          args: ""
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-ubuntu-22.04
          path: target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 7

  result:
    name: Desktop result
    if: always()
    needs: [admission, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Propagate build failures
        env:
          ADMISSION: ${{ needs.admission.result }}
          BUILD: ${{ needs.admission.outputs.build }}
          BUILD_WINDOWS: ${{ needs.admission.outputs.windows }}
          REUSED_RUN: ${{ needs.admission.outputs.reused_run }}
          WINDOWS: ${{ needs.windows.result }}
          LINUX: ${{ needs.linux.result }}
        run: |
          set -euo pipefail
          test "$ADMISSION" = success
          if [[ "$BUILD" == true ]]; then
            if [[ "$BUILD_WINDOWS" == true ]]; then
              test "$WINDOWS" = success
            else
              test "$BUILD_WINDOWS" = false
              [[ "$REUSED_RUN" =~ ^[0-9]+$ ]]
              test "$WINDOWS" = skipped
            fi
            test "$LINUX" = success
          else
            test "$BUILD" = false
            test "$WINDOWS" = skipped
            test "$LINUX" = skipped
          fi
