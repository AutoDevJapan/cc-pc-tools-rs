name: Task runner software capture
on:
  workflow_dispatch:
  pull_request:
    paths: ['tools/task-runner-capture/**', '.github/workflows/task-runner-capture.yml']
permissions:
  contents: read
concurrency:
  group: task-runner-capture-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    if: github.event_name == 'pull_request' && github.repository == 'AutoDevJapan/cc-pc-tools-rs' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/task-runner-capture
    steps:
      - name: Admit the current hosted source before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CI_REPOSITORY -cne 'AutoDevJapan/cc-pc-tools-rs' -or $env:CI_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'runner_source_identity_invalid' }
          $branch = [Uri]::EscapeDataString($env:CI_BRANCH)
          $current = & gh api --method GET "repos/$env:CI_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($current.Trim() -cne $env:CI_SOURCE_SHA) { throw 'Source revision is no longer current' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: tools/task-runner-capture/go.mod
          cache: false
      - run: go test -mod=readonly -race -timeout 120s -v ./...
      - run: go vet -mod=readonly ./...
      - run: go build -mod=readonly -trimpath .
  task-runner-capture:
    name: Task runner software artifact
    if: github.event_name == 'workflow_dispatch' && github.repository == 'AutoDevJapan/cc-pc-tools-rs' && github.repository_id == '1406818713' && github.ref == 'refs/heads/main' && github.event.repository.private == false && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.runner_upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.runner_upload.outputs.artifact-digest }}
      job-id: ${{ steps.runner_capture.outputs.job-id }}
      runner-sha256: ${{ steps.runner_capture.outputs.runner-sha256 }}
      source-manifest-sha256: ${{ steps.runner_capture.outputs.source-manifest-sha256 }}
    steps:
      - name: Admit the current hosted source before checkout
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CI_REPOSITORY -cne 'AutoDevJapan/cc-pc-tools-rs' -or $env:CI_SOURCE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'runner_source_identity_invalid' }
          $branch = [Uri]::EscapeDataString($env:CI_BRANCH)
          $current = & gh api --method GET "repos/$env:CI_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($current.Trim() -cne $env:CI_SOURCE_SHA) { throw 'Source revision is no longer current' }
      - name: Check out the reviewed producer revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the fixed reviewed runner source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ea56c94fc2820dc349316d15bea38b7f1ae85595
          path: runner-source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the runner Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: runner-source/unattended-runner/go.mod
          cache: false
      # Capture source before and after the only formal runner build.
      # The producer revision and fixed runner source remain separate.
      - name: Capture the fixed runner build
        id: runner_capture
        working-directory: producer/tools/task-runner-capture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUNNER_CAPTURE_CHECK_RUN_ID: ${{ job.check_run_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          go run -mod=readonly .
          exit $LASTEXITCODE
      - name: Check the exact captured files
        shell: pwsh
        env:
          ARTIFACT_DIRECTORY: ${{ steps.runner_capture.outputs.artifact-directory }}
          ARTIFACT_NAME: ${{ steps.runner_capture.outputs.artifact-name }}
          CAPTURE_JOB_ID: ${{ steps.runner_capture.outputs.job-id }}
          RUNNER_SHA256: ${{ steps.runner_capture.outputs.runner-sha256 }}
          CAPTURE_SHA256: ${{ steps.runner_capture.outputs.capture-sha256 }}
          SOURCE_MANIFEST_SHA256: ${{ steps.runner_capture.outputs.source-manifest-sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CAPTURE_JOB_ID -notmatch '^[1-9][0-9]{0,18}$') { throw 'runner_capture_job_invalid' }
          foreach ($sha in @($env:RUNNER_SHA256, $env:CAPTURE_SHA256, $env:SOURCE_MANIFEST_SHA256)) {
            if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'runner_capture_digest_invalid' }
          }
          $expectedName = 'task-runner-software-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + $env:CAPTURE_JOB_ID
          if ($env:ARTIFACT_NAME -cne $expectedName) { throw 'runner_capture_name_invalid' }
          $expectedDir = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ('task-runner-capture/' + $env:GITHUB_RUN_ID + '/' + $env:GITHUB_RUN_ATTEMPT + '/' + $env:CAPTURE_JOB_ID)))
          if (-not [string]::Equals([IO.Path]::GetFullPath($env:ARTIFACT_DIRECTORY), $expectedDir, [StringComparison]::OrdinalIgnoreCase)) { throw 'runner_capture_directory_invalid' }
          $directory = Get-Item -LiteralPath $expectedDir
          if (-not $directory.PSIsContainer -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'runner_capture_directory_invalid' }
          $files = @(Get-ChildItem -LiteralPath $expectedDir -Force)
          if ($files.Count -ne 3) { throw 'runner_capture_inventory_invalid' }
          $expected = @{
            'unattended-runner.exe' = @($env:RUNNER_SHA256, [long](32MB))
            'capture.json' = @($env:CAPTURE_SHA256, [long](64KB))
            'source-proof.json' = @($env:SOURCE_MANIFEST_SHA256, [long](8MB))
          }
          foreach ($file in $files) {
            if (-not $expected.ContainsKey($file.Name) -or $file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -le 0 -or $file.Length -gt $expected[$file.Name][1]) { throw 'runner_capture_file_invalid' }
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected[$file.Name][0]) { throw 'runner_capture_file_changed' }
          }
      - name: Attest the runner and source evidence
        id: runner_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.runner_capture.outputs.artifact-directory }}/unattended-runner.exe
            ${{ steps.runner_capture.outputs.artifact-directory }}/source-proof.json
            ${{ steps.runner_capture.outputs.artifact-directory }}/capture.json
          push-to-registry: false
          create-storage-record: false
      - name: Upload the fixed runner capture
        id: runner_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.runner_capture.outputs.artifact-name }}
          path: |
            ${{ steps.runner_capture.outputs.artifact-directory }}/unattended-runner.exe
            ${{ steps.runner_capture.outputs.artifact-directory }}/capture.json
            ${{ steps.runner_capture.outputs.artifact-directory }}/source-proof.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      - name: Record the server-assigned capture artifact
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.runner_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.runner_upload.outputs.artifact-digest }}
          ARTIFACT_NAME: ${{ steps.runner_capture.outputs.artifact-name }}
          CAPTURE_JOB_ID: ${{ steps.runner_capture.outputs.job-id }}
          CAPTURE_CHECK_RUN_ID: ${{ job.check_run_id }}
          RUNNER_SHA256: ${{ steps.runner_capture.outputs.runner-sha256 }}
          CAPTURE_SHA256: ${{ steps.runner_capture.outputs.capture-sha256 }}
          SOURCE_MANIFEST_SHA256: ${{ steps.runner_capture.outputs.source-manifest-sha256 }}
          ATTESTATION_ID: ${{ steps.runner_attest.outputs.attestation-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @($env:ARTIFACT_ID, $env:CAPTURE_JOB_ID, $env:CAPTURE_CHECK_RUN_ID)) {
            if ($id -notmatch '^[1-9][0-9]{0,18}$') { throw 'task_runner_artifact_server_id_missing' }
          }
          if ($env:ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') { throw 'task_runner_artifact_server_digest_missing' }
          if ($env:ATTESTATION_ID -notmatch '^[0-9A-Za-z_-]{1,128}$') { throw 'runner_attestation_id_missing' }
          $result = [ordered]@{
            domain = 'task-runner-gha-publication-v1'
            repository_id = [long]$env:GITHUB_REPOSITORY_ID
            source = 'ea56c94fc2820dc349316d15bea38b7f1ae85595'
            source_tree = 'f9c9fce316d22f86517b7d766b7056ea0516fa29'
            producer_revision = $env:GITHUB_SHA
            run_id = [long]$env:GITHUB_RUN_ID
            run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
            job_id = [long]$env:CAPTURE_JOB_ID
            check_run_id = [long]$env:CAPTURE_CHECK_RUN_ID
            artifact_id = [long]$env:ARTIFACT_ID
            artifact_name = $env:ARTIFACT_NAME
            archive_sha256 = $env:ARTIFACT_DIGEST
            output_sha256 = $env:RUNNER_SHA256
            capture_sha256 = $env:CAPTURE_SHA256
            source_manifest_sha256 = $env:SOURCE_MANIFEST_SHA256
            attestation_id = $env:ATTESTATION_ID
            data_access_granted = $false
            update_performed = $false
            send_allowed = $false
            source_quiescence_proved = $false
          }
          $json = $result | ConvertTo-Json -Depth 4 -Compress
          if ([Text.Encoding]::UTF8.GetByteCount($json) -gt 8192) { throw 'task_runner_artifact_record_too_large' }
          Write-Output ('task_runner_gha_publication_v1=' + $json)
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, 'task_runner_gha_publication_v1=' + $json + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
