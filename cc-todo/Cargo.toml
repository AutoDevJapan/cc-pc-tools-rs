[package]
name = "cc-todo"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
cc-task-title = { path = "../cc-task-title" }
cc-ask = { path = "../cc-ask" }
cc-job-policy = { path = "../cc-job-policy" }
cc-scheduler = { path = "../cc-scheduler" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Registry", "Win32_Networking_WinHttp"] }

[dev-dependencies]
tempfile = "3"
