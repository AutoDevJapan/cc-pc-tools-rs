<script>
(() => {
  'use strict';
  function bootConsoleShell(){
    if(document.querySelector('[data-console-shell-ready]'))return;
    const music=!document.querySelector('#view-kanban')&&(location.pathname==='/music'||location.pathname.startsWith('/music/'));
    const q=s=>document.querySelector(s), make=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node};
    let musicLoading;
    let musicController=null,musicGeneration=0;
    window.cancelConsoleMusic=()=>{musicGeneration++;if(musicController)musicController.abort();musicController=null;musicLoading=null;const host=q('#view-music');if(host)host.removeAttribute('aria-busy')};
    function musicFields(host){return Array.from(host.querySelectorAll('form')).flatMap((form,index)=>Array.from(form.querySelectorAll('input[name],textarea[name],select[name]')).filter(field=>!['hidden','password','file','submit','button'].includes(field.type)).map((field,ordinal)=>({field,key:JSON.stringify([index,form.getAttribute('action'),field.name,ordinal])})))}
    function retainMusicState(host,content){
      const fields=musicFields(host).filter(({field})=>field.dataset.consoleDirty==='true'),fresh=new Map(musicFields(content).map(item=>[item.key,item.field]));
      const focused=fields.find(({field})=>field===document.activeElement);
      for(const {key,field} of fields){const replacement=fresh.get(key);if(replacement)replacement.replaceWith(field)}
      const media=Array.from(host.querySelectorAll('audio')).map(node=>({node,source:node.getAttribute('src')}));
      for(const node of Array.from(content.querySelectorAll('audio'))){const old=media.find(item=>item.source&&item.source===node.getAttribute('src'));if(old){node.replaceWith(old.node);media.splice(media.indexOf(old),1)}}
      return focused&&fresh.has(focused.key)?focused.field:null;
    }
    document.addEventListener('input',event=>{if(event.target.closest?.('#view-music form')&&event.target.name&&!['hidden','password','file'].includes(event.target.type))event.target.dataset.consoleDirty='true'});
    document.addEventListener('change',event=>{if(event.target.closest?.('#view-music form')&&event.target.name&&!['hidden','password','file'].includes(event.target.type))event.target.dataset.consoleDirty='true'});
    window.loadConsoleMusic=({force=false}={})=>{
      const host=q('#view-music');
      if(!host||(!force&&host.dataset.musicLoaded==='true'))return Promise.resolve();
      if(musicLoading)return musicLoading;
      if(host.dataset.musicLoaded!=='true')host.textContent='音楽制作を読み込み中…';
      host.setAttribute('aria-busy','true');
      const controller=new AbortController(),generation=musicGeneration,timeout=setTimeout(()=>controller.abort(),12000);musicController=controller;
      musicLoading=fetch('/music',{signal:controller.signal,headers:{Accept:'text/html'}}).then(async response=>{
        const text=await response.text();if(generation!==musicGeneration||controller.signal.aborted)return;if(!response.ok&&host.dataset.musicLoaded==='true')throw new Error('音楽制作を更新できませんでした。HTTP '+response.status);const page=new DOMParser().parseFromString(text,'text/html'),content=page.querySelector('#view-music');
        if(!content)throw new Error('音楽制作の画面を確認できませんでした。');
        const next=document.importNode(content,true),focused=retainMusicState(host,next);
        host.replaceChildren(...Array.from(next.childNodes));
        if(focused&&host.contains(focused))focused.focus({preventScroll:true});
        // Broker forms and scoped styles are native DOM; no iframe or document
        // navigation. Scripts parsed from broker HTML remain inert, as the
        // direct page's CSP authorizes only compiled Console scripts.
        host.dataset.musicLoaded=String(response.ok);
        if(!response.ok){const retry=make('button','','音楽制作を再読込');retry.type='button';retry.onclick=window.loadConsoleMusic;host.append(retry)}
      }).catch(error=>{
        if(generation!==musicGeneration)return;
        const message=make('p','console-music-note',error.name==='AbortError'?'音楽制作の接続が時間切れになりました。':error.message),retry=make('button','','音楽制作を再読込');
        retry.type='button';retry.onclick=()=>window.loadConsoleMusic({force:true});if(host.dataset.musicLoaded==='true'){const old=host.querySelector('[data-music-error]');if(old)old.remove();const error=make('div');error.dataset.musicError='true';error.setAttribute('role','alert');error.append(message,retry);host.prepend(error);if(!host.contains(document.activeElement))retry.focus()}else host.replaceChildren(message,retry);
      }).finally(()=>{clearTimeout(timeout);if(generation===musicGeneration){musicLoading=null;musicController=null;host.removeAttribute('aria-busy')}});
      return musicLoading;
    };
    const names=[['kanban','Operations'],['progress','作業進捗'],['workload','仕事量'],['systems','Systems'],['music','音楽制作 · Suno']];
    let frame=q('.shell'),main=frame&&frame.querySelector(':scope > main'),sidebar=frame&&frame.querySelector(':scope > .sidebar');
    if(music||!frame||!main){
      const existingMain=q('main'),content=make('div','console-music-body');
      if(existingMain)content.append(existingMain);else Array.from(document.body.children).filter(node=>!['SCRIPT','STYLE'].includes(node.tagName)&&!node.matches('meta[name="local-ai-console-shell"]')).forEach(node=>content.append(node));
      frame=make('div','shell');sidebar=make('aside','sidebar');main=make('main');frame.append(sidebar,main);document.body.append(frame);
      const brand=make('div','brand');brand.append(make('h1','','Local AI Console'));sidebar.append(brand,make('nav','nav'));
      const header=make('header','topbar'),heading=make('div');heading.append(make('h2','','音楽制作 · Suno'),make('p','','曲の下書きと生成候補を選ぶ'));header.append(heading);main.append(header);
      main.append(make('p','console-music-note','下書き・曲候補の選択を扱います。MVと投稿は未接続です。'),content);
    }
    frame.classList.add('console-shell');frame.dataset.consoleShellReady='true';
    if(q('#view-music.active'))window.loadConsoleMusic();
    const nav=sidebar.querySelector('.nav');nav.id='console-navigation';nav.setAttribute('aria-label','機能');
    const existing=Array.from(nav.querySelectorAll('[data-view],a[href="/music"]'));
    const links=names.map(([view,label])=>{let link=existing.find(node=>node.dataset.view===view||(view==='music'&&node.getAttribute('href')==='/music'));if(!link){link=make('a','',label);link.href=view==='music'?'/music':view==='progress'?'/progress':'/?view='+view;link.dataset.view=view}link.removeAttribute('style');return link});
    nav.replaceChildren(make('h2','console-nav-heading','運用'),...links.slice(0,4),make('h2','console-nav-heading','会話・制作'),...links.slice(4));
    const toggle=make('button','console-menu-toggle','☰ メニュー');toggle.type='button';toggle.setAttribute('aria-controls',nav.id);sidebar.querySelector('.brand').prepend(toggle);
    function menu(open){frame.classList.toggle('console-menu-closed',!open);toggle.setAttribute('aria-expanded',String(open))}
    menu(!matchMedia('(max-width:1199px)').matches);toggle.onclick=()=>menu(frame.classList.contains('console-menu-closed'));
    nav.addEventListener('keydown',event=>{const targets=Array.from(nav.querySelectorAll('button,a')).filter(node=>!node.hidden),index=targets.indexOf(document.activeElement);if(event.key==='Escape'){event.preventDefault();menu(false);toggle.focus()}else if(index>=0&&['ArrowDown','ArrowUp','Home','End'].includes(event.key)){event.preventDefault();targets[event.key==='Home'?0:event.key==='End'?targets.length-1:(index+(event.key==='ArrowDown'?1:-1)+targets.length)%targets.length].focus()}});
    links.forEach((link,index)=>{const view=names[index][0];if(!music&&(view!=='music'||q('#view-music')))link.onclick=event=>{if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();if(typeof switchView==='function')switchView(view,{focus:true});if(matchMedia('(max-width:1199px)').matches)menu(false)};if(music&&view==='music'){link.classList.add('active');link.setAttribute('aria-current','page')}});
    if(q('#stop-btn')){q('#stop-btn').textContent='Local AI全体を停止';q('#stop-btn').title='既存の停止操作の対象はLocal AI全体です。サービス個別の停止ではありません。'}
    if(q('#mini-stop')){q('#mini-stop').textContent='Local AI全体を停止';q('#mini-stop').title=q('#stop-btn').title}
    const status=make('details','console-status');status.append(make('summary','','取得の詳細'));
    const sourceList=make('div','console-source-list'),note=make('p','console-status-note');status.append(sourceList,note);
    if(q('#view-kanban'))q('#view-kanban').append(status);
    const sources=new Map(),rows=new Map(),musicBusy=new Set(),sharedControllers=new Map();
    const array=value=>Array.isArray(value)?value:[],num=value=>typeof value==='number'&&Number.isFinite(value)&&value>=0?value:null;
    function stamp(value){if(value==null||value==='')return null;const date=new Date(value);return Number.isFinite(date.getTime())?date:null}
    function time(value){const date=stamp(value);return date?date.toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})+' JST':'—'}
    const waiting=worker=>{const reason=worker.waitKind||worker.waitingReason||worker.waitReason;return ['owner','decision','owner_decision'].includes(reason)?'decision':['resource','capacity','build'].includes(reason)?'resource':['dependency','todo'].includes(reason)||worker.todoStatus==='wait'?'dependency':''};
    const countNodes=new Map();
    function drawSources(){
      for(const [key,source] of sources){
        let row=rows.get(key);if(!row){const holder=make('div','console-source-row'),label=make('strong','',({operations:'Operations',health:'Systems',todo:'共有ToDo',jobs:'ジョブ',handoff:'引き継ぎ'})[key]||key),text=make('span'),retry=make('button','','再試行');retry.type='button';retry.onclick=()=>retrySource(key);holder.append(label,text,retry);sourceList.append(holder);row={holder,text,retry};rows.set(key,row)}
        const aged=source.receivedAt&&Date.now()-source.receivedAt>45000,old=stamp(source.data&&source.data.fetchedAt),originOld=old&&Date.now()-old.getTime()>45000;
        const partial=key==='operations'&&source.data&&source.data.sourceOk!==true;
        row.holder.dataset.error=String(Boolean(source.error||partial));row.retry.hidden=!source.error&&!partial;row.retry.disabled=Boolean(source.loading);
        row.text.textContent=`取得 ${time(source.receivedAt)} · ${source.loading?'更新中 · ':''}${source.error?(source.receivedAt?'取得失敗・前回保持（古い情報）':'取得失敗・未取得')+' · '+source.error:source.receivedAt?(aged?'古い情報':partial?'一部の原本が未取得':'確認済み'):'未取得 —'}${old?' · 原本 '+time(old)+(originOld?'（古い情報）':''):''}`;
      }
      const operations=sources.get('operations'),data=operations&&operations.data,workers=array(data&&data.departments).flatMap(dept=>array(dept.products).flatMap(product=>array(product.workers))),metrics=data&&data.metrics||{};
      const originalSources=array(data&&data.sources),sourceOk=key=>originalSources.some(source=>source.key===key&&source.ok===true),workerCountsKnown=sourceOk('todos')&&sourceOk('jobs')&&stamp(data&&data.fetchedAt)!==null;
      const values={decision:num(metrics.confirmedUnansweredQuestions),resource:workerCountsKnown?workers.filter(worker=>worker.status==='waiting'&&waiting(worker)==='resource').length:null,attention:workerCountsKnown?workers.filter(worker=>worker.status==='attention').length:null,working:num(metrics.activeJobs)};
      for(const [key,node] of countNodes)node.textContent=values[key]==null?'—':String(values[key]);
      const unknown=workers.filter(worker=>worker.status==='waiting'&&!waiting(worker)).length;

    function receive(key,patch){sources.set(key,{...(sources.get(key)||{}),...patch});drawSources()}

    const operationsView=q('#view-kanban');let shared,sharedBody,todoList,todoProject,todoStatus,todoSearch,jobsHost,jobsSearch,handoffHost;

    const short=value=>{const text=String(value||'').trim().replace(/\s+/g,' ');return text.length>180?text.slice(0,180)+'…':text};

    function applyShared(key,data){

      todoProject.append(make('option','','すべて'));todoProject.firstChild.value='';for(const [text,input] of [['プロジェクト',todoProject],['状態',todoStatus],['検索',todoSearch]]){const label=make('label','',text);label.append(input);filters.append(label)}sharedBody.append(filters);todoList=make('div','console-todo-list');todoList.append(make('p','','共有ToDoは未取得です。'));sharedBody.append(todoList);

    function openOperations(key){

    }
