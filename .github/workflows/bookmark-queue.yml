name: Bookmark queue
on:
  push:
    branches: [main]
    paths: ['cc-bookmark-queue/**', 'cc-ask/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/bookmark-queue.yml']
  pull_request:
    paths: ['cc-bookmark-queue/**', 'cc-ask/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/bookmark-queue.yml']
# Superseded PR heads need no second verification; preserve every main run.
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
permissions:
  contents: read
env:
  CI_JOB_TOKEN: ${{ github.token }}
jobs:
  test:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      matrix:
        include:
          - os: Windows
            labels: [self-hosted, Windows, X64, cc-pc-tools-windows]
          - os: Linux
            labels: [self-hosted, Linux, X64, cc-pc-tools-linux]
    runs-on: ${{ matrix.labels }}
    timeout-minutes: 15
    steps:
      - name: Admit current Windows source before checkout
        working-directory: ${{ runner.temp }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo fmt --manifest-path cc-bookmark-queue/Cargo.toml --check
      - run: cargo test --locked -p cc-bookmark-queue
      - run: cargo clippy --locked -p cc-bookmark-queue --all-targets -- -D warnings
      - run: node --test cc-bookmark-queue/tests/*.test.js
      - if: runner.os == 'Windows'
        run: cargo test --locked -p cc-ask --test commands --test resume
