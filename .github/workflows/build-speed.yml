name: Build speed
on:
  push:
    branches: [main]
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'cc-ocx-watchdog/**', 'cc-bookmark-queue/**', 'cc-channel-watch/**', 'chatgpt-web/**', 'cleanup-8h/**', 'safe-delete/**', 'tools/linux-runner-bridge/**', 'tools/product-ci/**', 'tools/test-scope/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/build-speed.yml', '.config/nextest.toml']
  pull_request:
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'cc-ocx-watchdog/**', 'cc-bookmark-queue/**', 'cc-channel-watch/**', 'chatgpt-web/**', 'cleanup-8h/**', 'safe-delete/**', 'tools/linux-runner-bridge/**', 'tools/product-ci/**', 'tools/test-scope/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml', '.cargo/**', '.github/workflows/build-speed.yml', '.config/nextest.toml']
# Supersede initial main pushes and PR heads; admission accepts current source only.
# Reruns and other events stay isolated so old runs cannot cancel current heads.
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && 'main' || github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1) || (github.event_name == 'pull_request' && github.run_attempt == 1) }}
permissions:
  contents: read
jobs:
  cc-jobs:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # The cargo gate, its locks and the process tests are Windows only.
    runs-on: [self-hosted, Windows, X64, cc-pc-tools-windows]
    timeout-minutes: 90
    steps:
      - name: Admit current Windows source before checkout
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/test-scope/go.mod
          cache: false
      - name: Verify the test selection boundary
        run: go -C tools/test-scope test ./...
      - name: Select affected packages at the fixed source revision
        env:
          SCOPE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SCOPE_EVENT_NAME: ${{ github.event_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $argsForScope = @('-C', 'tools/test-scope', 'run', '.', '-root', $env:GITHUB_WORKSPACE, '-head', $env:SCOPE_HEAD_SHA, '-event', $env:SCOPE_EVENT_NAME)
          if ($env:SCOPE_BASE_SHA) { $argsForScope += @('-base', $env:SCOPE_BASE_SHA) }
          $scopeJson = & go @argsForScope
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scopeJson | Set-Content -LiteralPath "$env:RUNNER_TEMP/test-scope.json" -Encoding utf8
          $scopeJson
      - name: Test and lint the selected packages once
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scope = Get-Content -LiteralPath "$env:RUNNER_TEMP/test-scope.json" -Raw | ConvertFrom-Json
          if ($scope.mode -eq 'none') { Write-Output 'No affected Rust packages'; exit 0 }
          $packageArgs = @()
          foreach ($name in $scope.packages) { $packageArgs += @('-p', [string]$name) }
          if ($scope.mode -eq 'full') { $packageArgs = @('--workspace') }
          & cargo nextest run --locked @packageArgs --no-fail-fast --test-threads 10
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($scope.doc_packages.Count -gt 0) {
            $docArgs = @()
            foreach ($name in $scope.doc_packages) { $docArgs += @('-p', [string]$name) }
            & cargo test --locked @docArgs --doc -- --test-threads=10
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & cargo clippy --locked @packageArgs --all-targets -- -D warnings
          exit $LASTEXITCODE
  package-tools:
    # Only this finite repair needs downloadable PC binaries; do not grow storage on every PR.
    if: github.event_name == 'pull_request' && (github.event.pull_request.head.ref == 'fix/todo1139-timed-retry' || github.event.pull_request.head.ref == 'fix/console-todo-capacity-1460' || github.event.pull_request.head.ref == 'fix/question-state-capacity-2444' || github.event.pull_request.head.ref == 'scheduler/todo-3255-unstarted-fallback') && github.event.pull_request.head.repo.full_name == github.repository
    needs: cc-jobs
    runs-on: [self-hosted, Windows, X64, cc-pc-tools-windows]
    timeout-minutes: 90
    env:
      PACKAGE_UNSTARTED_REVIEW: ${{ github.event.pull_request.head.ref == 'scheduler/todo-3255-unstarted-fallback' }}
    steps:
      - name: Admit current Windows source before checkout
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Build only the requested distribution tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @('cc-todo', 'cc-jobs', 'cc-scheduler', 'cc-ask', 'localai-web-rs')
          if ($env:PACKAGE_UNSTARTED_REVIEW -eq 'true') { $packages = @('cc-jobs', 'cc-scheduler') }
          $packageArgs = @()
          foreach ($name in $packages) { $packageArgs += @('-p', $name) }
          & cargo build --locked --release --target-dir target @packageArgs --bins
          exit $LASTEXITCODE
      - name: Record the exact checked-out source and binary hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '${{ github.event.pull_request.head.sha || github.sha }}') { throw 'Checked-out source differs from the fixed source revision' }
          $tree = git rev-parse 'HEAD^{tree}'
          if ($LASTEXITCODE -ne 0 -or $tree -notmatch '^[0-9a-f]{40}$') { throw 'Source tree is unavailable' }
          $names = @('todo.exe', 'codex_jobs.exe', 'scheduler.exe', 'discord_ask.exe', 'localai-web-rs.exe')
          if ($env:PACKAGE_UNSTARTED_REVIEW -eq 'true') { $names = @('codex_jobs.exe', 'scheduler.exe') }
          $package = "target/release/pc-tool-package-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $package | Out-Null
          $files = foreach ($name in $names) {
            $path = Join-Path 'target/release' $name
            $file = Get-Item -LiteralPath $path
            Copy-Item -LiteralPath $path -Destination (Join-Path $package $name)
            @{ name = $name; bytes = $file.Length; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
          }
          @{ revision = $revision; tree = $tree; run_id = $env:GITHUB_RUN_ID; files = @($files) } |
            ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $package 'tools-manifest.json') -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-tools-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: target/release/pc-tool-package-${{ github.run_id }}-${{ github.run_attempt }}/
