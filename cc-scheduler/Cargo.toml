[package]
name = "cc-scheduler"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "scheduler"
path = "src/main.rs"

[dependencies]
cc-ask = { path = "../cc-ask" }
cc-job-policy = { path = "../cc-job-policy" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
chrono = "0.4"
regex = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "native-tls"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"
cc-todo = { path = "../cc-todo" }
