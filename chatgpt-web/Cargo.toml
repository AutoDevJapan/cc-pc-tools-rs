[package]
name = "chatgpt-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "chatgpt_web"
path = "src/main.rs"
