name: Unattended readiness tools
env:
  CC_LINUX_RUNNER_MODE: normal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['resident-guard/**', 'capacity-audit-3h/**', 'unattended-runner/**', 'repair-guard/**', 'tools/guard-refresh-software-reader/**', 'tools/guard-gha-capture/**', 'tools/guard-attestation-verifier/**', 'tools/civ6-ci-contract/**', 'localai-web-rs/src/operations_catalog.rs', 'localai-web-rs/src/operations.rs', 'tools/linux-runner-bridge/**', '.github/workflows/unattended-readiness.yml']
  pull_request:
    paths: ['resident-guard/**', 'capacity-audit-3h/**', 'unattended-runner/**', 'repair-guard/**', 'tools/guard-refresh-software-reader/**', 'tools/guard-gha-capture/**', 'tools/guard-attestation-verifier/**', 'tools/civ6-ci-contract/**', 'localai-web-rs/src/operations_catalog.rs', 'localai-web-rs/src/operations.rs', 'tools/linux-runner-bridge/**', '.github/workflows/unattended-readiness.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  go:
    if: github.event_name != 'workflow_dispatch' && github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        os: [Windows, Linux]
        include:
          - os: Windows
            labels: [self-hosted, Windows, X64, cc-pc-tools-windows]
          - os: Linux
            labels: [self-hosted, Linux, X64, cc-pc-tools-linux]
        module: [resident-guard, capacity-audit-3h, unattended-runner, tools/linux-runner-bridge]
    runs-on: ${{ toJSON(github.event.repository.private) == 'false' && (matrix.os == 'Windows' && 'windows-2025' || 'ubuntu-24.04') || fromJSON(toJSON(matrix.labels)) }}
    timeout-minutes: ${{ matrix.os == 'Windows' && matrix.module == 'unattended-runner' && 20 || 10 }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - name: Admit current Windows source before checkout
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - name: Admit current hosted source before checkout
        if: runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $branch = [Uri]::EscapeDataString($env:CI_BRANCH)
          $current = & gh api --method GET "repos/$env:CI_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($current.Trim() -ne $env:CI_SOURCE_SHA) { throw 'Source revision is no longer current' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use the Linux job work directory for Go compilation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/go-tmp" "$RUNNER_TEMP/go-cache"
          printf 'TMPDIR=%s/go-tmp\nGOTMPDIR=%s/go-tmp\nGOCACHE=%s/go-cache\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Build the native question acceptance fixtures
        if: runner.os == 'Windows' && matrix.module == 'unattended-runner'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:RUSTUP_TOOLCHAIN = '1.95.0'
          $env:CARGO_INCREMENTAL = '0'
          $env:CARGO_PROFILE_DEV_DEBUG = '0'
          $env:CARGO_PROFILE_TEST_DEBUG = '0'
          $todo = & cargo build --locked -p cc-todo --bin todo --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $todoPath = @($todo | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'todo' -and $_.executable })[-1].executable
          $fixture = & cargo test --locked -p cc-scheduler --test parity --no-run --message-format=json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fixturePath = @($fixture | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'parity' -and $_.executable })[-1].executable
          if (-not $todoPath -or -not $fixturePath) { throw 'Native acceptance artifacts are missing' }
          "CC_CONVERSATION_TODO_BINARY=$todoPath" >> $env:GITHUB_ENV
          "CC_CONVERSATION_SCHEDULER_FIXTURE=$fixturePath" >> $env:GITHUB_ENV
      # Windows uses one compiled race binary and disjoint serial root groups.
      # A package-wide timer previously expired while a 21-second positive
      # helper was only four seconds old. Keep its real deadlines unchanged.
      - name: Test every Windows runner root with bounded serial partitions
        if: matrix.os == 'Windows' && matrix.module == 'unattended-runner'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = @(& go list ./...)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($packages.Count -ne 1 -or $packages[0] -cne 'github.com/AutoDevJapan/cc-pc-tools-rs/unattended-runner') { throw 'Windows runner package inventory changed' }
          $binary = Join-Path $env:RUNNER_TEMP 'unattended-runner-race.test.exe'
          if (Test-Path -LiteralPath $binary) { throw 'Windows runner test output already exists' }
          & go test -race -c -o $binary .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $list = @(& $binary '-test.list' '.' 2>&1)
          $listExit = $LASTEXITCODE
          $listExitText = if ($null -eq $listExit) { 'unknown' } else { ([long]$listExit).ToString([Globalization.CultureInfo]::InvariantCulture) }
          Write-Output ('UNATTENDED_WINDOWS_LIST exit={0} lines={1}' -f $listExitText,$list.Count)
          if ($list.Count -gt 10000) { throw 'Windows runner native root output exceeds line bound' }
          if ($null -eq $listExit -or $listExit -ne 0) {
            $failureClass = 'startup_unclassified'
            foreach ($item in $list) {
              $line = [string]$item
              if ($line -cmatch '^flag provided but not defined: -test(?:[.][a-z]+)?$') { $failureClass = 'test_flag_rejected' }
              if ($line -cmatch '^FATAL: ThreadSanitizer:') { $failureClass = 'race_runtime_startup' }
            }
            Write-Output ('UNATTENDED_WINDOWS_LIST_FAILURE class={0}' -f $failureClass)
          }
          if ($null -eq $listExit -or $listExit -ne 0) { throw 'Windows runner root list failed' }
          $names = [Collections.Generic.List[string]]::new()
          $seen = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($line in $list) {
            $name = [string]$line
            if ($name -cmatch '^Benchmark[A-Za-z0-9_]*$') { continue }
            if ($name.Length -gt 512 -or $name -cnotmatch '^(?:Test|Fuzz|Example)[A-Za-z0-9_]*$' -or -not $seen.Add($name)) { throw 'Windows runner root inventory invalid or repeated' }
            $names.Add($name)
          }
          if ($names.Count -lt 1 -or $names.Count -gt 10000) { throw 'Windows runner root inventory outside bounds' }
          foreach ($name in $names) { Write-Output ('UNATTENDED_WINDOWS_LIST_ROOT ' + $name) }
          $completed = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          $passed = 0
          $skipped = 0
          $partitions = 0
          $partitionCount = [int][Math]::Ceiling($names.Count / 50.0)
          for ($partition = 0; $partition -lt $partitionCount; $partition++) {
            $members = [Collections.Generic.List[string]]::new()
            for ($index = $partition; $index -lt $names.Count; $index += $partitionCount) { $members.Add($names[$index]) }
            $group = @($members.ToArray())
            if ($group.Count -lt 1 -or $group.Count -gt 50) { throw 'Windows runner partition size invalid' }
            $selection = '^(?:' + (($group | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')$'
            if ($selection.Length -gt 26000) { throw 'Windows runner root selection exceeds command bound' }
            Write-Output ('UNATTENDED_WINDOWS_PARTITION_START index={0} expected={1} budget_seconds=180' -f $partitions,$group.Count)
            $lines = @(& $binary '-test.v' '-test.timeout=180s' ('-test.run=' + $selection) 2>&1)
            $testExit = $LASTEXITCODE
            $exitText = if ($null -eq $testExit) { 'unknown' } else { ([long]$testExit).ToString([Globalization.CultureInfo]::InvariantCulture) }
            Write-Output ('UNATTENDED_WINDOWS_PARTITION index={0} expected={1} exit={2}' -f $partitions,$group.Count,$exitText)
            foreach ($item in $lines) {
              $line = [string]$item
              if ($line -cmatch '^(?:=== (?:RUN|PAUSE|CONT)[ \t]+[A-Za-z0-9_/.-]+[ \t]*|[ \t]*--- (?:PASS|SKIP|FAIL):[ \t]+[A-Za-z0-9_/.-]+[ \t]+\([0-9]+(?:[.][0-9]+)?s\)|PASS|FAIL)$') { Write-Output $line }
            }
            if ($null -eq $testExit -or $testExit -ne 0) {
              $sawTimeout = $false
              $sawRace = $false
              $sawTestFailure = $false
              foreach ($item in $lines) {
                $line = [string]$item
                if ($line -cmatch '^panic: test timed out after [0-9hms.]+$') { $sawTimeout = $true }
                if ($line -cmatch '^WARNING: DATA RACE') { $sawRace = $true }
                if ($line -cmatch '^[ \t]*--- FAIL:') { $sawTestFailure = $true }
              }
              $failureClass = if ($sawTimeout) { 'partition_timeout' } elseif ($sawRace) { 'data_race' } elseif ($sawTestFailure) { 'test_assertion' } else { 'native_exit_unclassified' }
              Write-Output ('UNATTENDED_WINDOWS_PARTITION_FAILURE index={0} class={1}' -f $partitions,$failureClass)
              throw 'Windows runner partition failed'
            }
            $output = [string]::Join([Environment]::NewLine, [string[]]$lines)
            $runs = @([regex]::Matches($output, '(?m)^=== RUN[ \t]+([^\s/]+)[ \t]*\r?$') | ForEach-Object { $_.Groups[1].Value })
            $passes = @([regex]::Matches($output, '(?m)^--- PASS:[ \t]+([^\s/]+)[ \t]+\(') | ForEach-Object { $_.Groups[1].Value })
            $skips = @([regex]::Matches($output, '(?m)^--- SKIP:[ \t]+([^\s/]+)[ \t]+\(') | ForEach-Object { $_.Groups[1].Value })
            if ([regex]::IsMatch($output, '(?m)^[ \t]*--- FAIL:|^panic:|^WARNING: DATA RACE')) { throw 'Windows runner partition emitted a failure' }
            if ($runs.Count -ne $group.Count -or $passes.Count + $skips.Count -ne $group.Count) { throw 'Windows runner partition omitted or added a root' }
            foreach ($name in $group) {
              if (@($runs | Where-Object { $_ -ceq $name }).Count -ne 1 -or @($passes + $skips | Where-Object { $_ -ceq $name }).Count -ne 1 -or -not $completed.Add($name)) { throw 'Windows runner root completion is missing or repeated' }
            }
            $passed += $passes.Count
            $skipped += $skips.Count
            $partitions++
          }
          if ($completed.Count -ne $names.Count) { throw 'Windows runner all-root reconciliation failed' }
          Write-Output ('UNATTENDED_WINDOWS_ROOTS listed={0} passed={1} skipped={2} partitions={3}; skipped roots are not passed acceptance' -f $names.Count,$passed,$skipped,$partitions)
      - if: matrix.os != 'Windows' || matrix.module != 'unattended-runner'
        run: go test -race -timeout ${{ matrix.module == 'unattended-runner' && '180s' || '120s' }} ./...
      - run: go vet ./...
      - run: go build -trimpath .
  repair-guard:
    permissions:
      contents: read
      actions: read
    if: github.event_name != 'workflow_dispatch' && github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ toJSON(github.event.repository.private) == 'false' && 'windows-2025' || fromJSON('["self-hosted","Windows","X64","cc-pc-tools-windows"]') }}
    # The expanded guard suite includes 333 top-level tests and serial real-Git
    # lineage checks (one seven-product group takes several minutes). A 10m
    # job canceled it while tests were still progressing, before Go could emit
    # its own timeout trace. Keep all cases and a finite diagnostic deadline.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: repair-guard
    steps:
      - name: Admit current Windows source before checkout
        if: runner.environment == 'self-hosted'
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - name: Admit current hosted source before checkout
        if: runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $branch = [Uri]::EscapeDataString($env:CI_BRANCH)
          $current = & gh api --method GET "repos/$env:CI_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($current.Trim() -ne $env:CI_SOURCE_SHA) { throw 'Source revision is no longer current' }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: repair-guard/go.mod
          cache: false
      - run: go run ./internal/cataloggen -check
      # The suite opens many real Git paths. Hashing those test-cache inputs
      # took another 323s after its 429s PASS on Windows. Always run the cases
      # and skip result-cache bookkeeping; the compilation cache stays enabled.
      - run: go test -count=1 -v -timeout 20m ./...
      - run: go vet ./...
      - run: go build -trimpath .
      - name: Test the known guard software reader
        working-directory: tools/guard-refresh-software-reader
        run: |
          go test -count=1 -v .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -trimpath .
          exit $LASTEXITCODE
      - name: Verify the fixed public source archive
        working-directory: tools/guard-refresh-software-reader
        shell: pwsh
        timeout-minutes: 5
        env:
          GUARD_GHA_ACTUAL_SIGNED_SOURCE: '1'
        run: |
          $lines = @(& go test -count=1 -v -timeout 3m -run '^TestGHAGuardOfficialSourceArchiveReal$' . 2>&1)
          $testExit = $LASTEXITCODE
          $lines | ForEach-Object { Write-Output $_ }
          if ($null -eq $testExit) { throw 'The public source archive test did not return an exit code.' }
          if ($testExit -ne 0) { exit $testExit }
          $output = [string]::Join([Environment]::NewLine, [string[]]$lines)
          $runs = @([regex]::Matches($output, '(?m)^=== RUN[ \t]+(\S+)[ \t]*\r?$'))
          $passes = @([regex]::Matches($output, '(?m)^--- PASS: (\S+) \([0-9]+(?:\.[0-9]+)?s\)\r?$'))
          $skips = [regex]::Matches($output, '(?m)^[ \t]*--- SKIP:').Count
          $failures = [regex]::Matches($output, '(?m)^[ \t]*--- FAIL:').Count
          if ($runs.Count -ne 1 -or $runs[0].Groups[1].Value -cne 'TestGHAGuardOfficialSourceArchiveReal' -or $passes.Count -ne 1 -or $passes[0].Groups[1].Value -cne 'TestGHAGuardOfficialSourceArchiveReal' -or $skips -ne 0 -or $failures -ne 0) {
            throw 'Expected exactly one passing public source archive test with no skips.'
          }
          Write-Output 'Public source archive: 1 run, 1 pass, 0 skips.'
      - name: Test credential transport with the race detector
        working-directory: tools/guard-refresh-software-reader
        shell: pwsh
        timeout-minutes: 7
        run: |
          & go test -race -count=1 -v -timeout 3m -run '^TestGHAGuardCredential' . 2>&1 | Tee-Object -Variable raceLines
          $testExit = $LASTEXITCODE
          if ($null -eq $testExit) { throw 'The credential race test did not return an exit code.' }
          if ($testExit -ne 0) { exit $testExit }
          $output = [string]::Join([Environment]::NewLine, [string[]]@($raceLines))
          $expected = @(
            'TestGHAGuardCredentialExactPolicy',
            'TestGHAGuardCredentialOwnerIdentity',
            'TestGHAGuardCredentialValueAndExpiry',
            'TestGHAGuardCredentialTransportScopeAndCleanup',
            'TestGHAGuardCredentialTransportRedactionAndPendingClose',
            'TestGHAGuardCredentialStatusCategories',
            'TestGHAGuardCredentialRequestLifetime',
            'TestGHAGuardCredentialRequestLifetime/success',
            'TestGHAGuardCredentialRequestLifetime/caller-cancel',
            'TestGHAGuardCredentialRequestLifetime/close-timeout',
            'TestGHAGuardCredentialRequestLifetime/transport-error'
          )
          $runs = @([regex]::Matches($output, '(?m)^[ \t]*=== RUN[ \t]+(\S+)[ \t]*\r?$'))
          $passes = @([regex]::Matches($output, '(?m)^[ \t]*--- PASS:[ \t]+(\S+)[ \t]+\([0-9]+(?:\.[0-9]+)?s\)\r?$'))
          $skips = [regex]::Matches($output, '(?m)^[ \t]*--- SKIP:').Count
          $failures = [regex]::Matches($output, '(?m)^[ \t]*--- FAIL:').Count
          $raceReports = [regex]::Matches($output, '(?m)^[ \t]*WARNING: DATA RACE[ \t]*\r?$').Count
          if ($runs.Count -ne $expected.Count -or $passes.Count -ne $expected.Count -or $skips -ne 0 -or $failures -ne 0 -or $raceReports -ne 0) {
            throw 'Expected exactly seven credential tests and four subtests to pass with no skips or race reports.'
          }
          foreach ($name in $expected) {
            if (@($runs | Where-Object { $_.Groups[1].Value -ceq $name }).Count -ne 1 -or @($passes | Where-Object { $_.Groups[1].Value -ceq $name }).Count -ne 1) {
              throw 'A required credential test or subtest did not run and pass exactly once.'
            }
          }
          Write-Output 'Credential race tests: 7 roots and 4 subtests passed; 0 skips.'
      - name: Verify fixed signed-source evidence while retained
        if: runner.environment == 'github-hosted'
        working-directory: tools/guard-refresh-software-reader
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_GHA_ACTUAL_SIGNED_SOURCE: '1'
        run: |
          $expiry = [DateTimeOffset]::Parse('2026-11-15T08:09:29Z')
          # go test -timeout covers the test binary, not compilation.
          # Allow compilation time before the binary makes its own window check.
          if (($expiry - [DateTimeOffset]::UtcNow) -lt [TimeSpan]::FromMinutes(10)) {
            Write-Output 'GUARD_ACTUAL_NOT_EXECUTED=workflow_window'
            exit 0
          }
          $lines = @(& go test -count=1 -v -timeout 8m -run '^TestGHAGuardActualSignedSourceIntegration$' . 2>&1)
          $testExit = $LASTEXITCODE
          $lines | ForEach-Object { Write-Output $_ }
          if ($testExit -ne 0) { exit $testExit }
          $output = [string]::Join([Environment]::NewLine, [string[]]$lines)
          if ($output -match '(?m)^--- SKIP: TestGHAGuardActualSignedSourceIntegration \(') {
            if ($output -notmatch 'GUARD_ACTUAL_NOT_EXECUTED=(entry_window|acquisition_deadline|phase_window)') { throw 'Unclassified signed-source skip.' }
            Write-Output 'Fixed signed-source acceptance not executed.'
            exit 0
          }
          if ($output -notmatch '(?m)^--- PASS: TestGHAGuardActualSignedSourceIntegration \(') { throw 'Fixed signed-source positive was not executed.' }
          foreach ($caseName in @('none','blob-mutated','blob-missing','bundle-mutated','archive-mutated','proof-mutated')) {
            $pattern = '(?m)^\s*--- PASS: TestGHAGuardActualSignedSourceIntegration/' + [regex]::Escape($caseName) + ' \('
            if ($output -notmatch $pattern) { throw 'A fixed signed-source control was not executed.' }
          }
      - name: Test the fixed guard capture helper
        working-directory: tools/guard-gha-capture
        run: |
          go test -count=1 -timeout 3m .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet .
          exit $LASTEXITCODE
  guard-bootstrap:
    name: Guard bootstrap artifact
    if: github.event_name == 'workflow_dispatch' && github.repository == 'AutoDevJapan/cc-pc-tools-rs' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      artifact-id: ${{ steps.guard_upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.guard_upload.outputs.artifact-digest }}
      job-id: ${{ steps.guard_capture.outputs.job-id }}
      guard-sha256: ${{ steps.guard_capture.outputs.guard-sha256 }}
      source-manifest-sha256: ${{ steps.guard_capture.outputs.source-manifest-sha256 }}
    steps:
      - name: Check out the reviewed producer revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.sha }}
          path: producer
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the fixed reviewed guard source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: 80c4ed5cbd864585f4894c6286d3d5c92194c1f5
          path: guard-source
          fetch-depth: 0
          persist-credentials: false
      - name: Set up the guard Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: guard-source/repair-guard/go.mod
          cache: false
      # Capture source before and after the only formal guard build.
      # The producer revision and fixed guard source remain separate.
      - name: Capture the fixed guard build
        id: guard_capture
        working-directory: producer/tools/guard-gha-capture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_CHECK_RUN_ID: ${{ job.check_run_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          go run .
          exit $LASTEXITCODE
      - name: Check the exact captured files
        shell: pwsh
        env:
          ARTIFACT_DIRECTORY: ${{ steps.guard_capture.outputs.artifact-directory }}
          ARTIFACT_NAME: ${{ steps.guard_capture.outputs.artifact-name }}
          CAPTURE_JOB_ID: ${{ steps.guard_capture.outputs.job-id }}
          GUARD_SHA256: ${{ steps.guard_capture.outputs.guard-sha256 }}
          CAPTURE_SHA256: ${{ steps.guard_capture.outputs.capture-sha256 }}
          SOURCE_MANIFEST_SHA256: ${{ steps.guard_capture.outputs.source-manifest-sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CAPTURE_JOB_ID -notmatch '^[1-9][0-9]{0,18}$') { throw 'guard_capture_job_invalid' }
          foreach ($sha in @($env:GUARD_SHA256, $env:CAPTURE_SHA256, $env:SOURCE_MANIFEST_SHA256)) {
            if ($sha -notmatch '^[0-9a-f]{64}$') { throw 'guard_capture_digest_invalid' }
          }
          $expectedName = 'guard-bootstrap-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT + '-' + $env:CAPTURE_JOB_ID
          if ($env:ARTIFACT_NAME -cne $expectedName) { throw 'guard_capture_name_invalid' }
          $expectedDir = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP ('guard-gha-capture/' + $env:GITHUB_RUN_ID + '/' + $env:GITHUB_RUN_ATTEMPT + '/' + $env:CAPTURE_JOB_ID)))
          if (-not [string]::Equals([IO.Path]::GetFullPath($env:ARTIFACT_DIRECTORY), $expectedDir, [StringComparison]::OrdinalIgnoreCase)) { throw 'guard_capture_directory_invalid' }
          $directory = Get-Item -LiteralPath $expectedDir
          if (-not $directory.PSIsContainer -or ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'guard_capture_directory_invalid' }
          $files = @(Get-ChildItem -LiteralPath $expectedDir -Force)
          if ($files.Count -ne 3) { throw 'guard_capture_inventory_invalid' }
          $expected = @{
            'guard.exe' = @($env:GUARD_SHA256, [long](32MB))
            'capture.json' = @($env:CAPTURE_SHA256, [long](64KB))
            'source-proof.json' = @($env:SOURCE_MANIFEST_SHA256, [long](8MB))
          }
          foreach ($file in $files) {
            if (-not $expected.ContainsKey($file.Name) -or $file.PSIsContainer -or ($file.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $file.Length -le 0 -or $file.Length -gt $expected[$file.Name][1]) { throw 'guard_capture_file_invalid' }
            $actual = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected[$file.Name][0]) { throw 'guard_capture_file_changed' }
          }
      - name: Attest the guard and source evidence
        id: guard_attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            ${{ steps.guard_capture.outputs.artifact-directory }}/guard.exe
            ${{ steps.guard_capture.outputs.artifact-directory }}/source-proof.json
          push-to-registry: false
          create-storage-record: false
      - name: Upload the fixed guard capture
        id: guard_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.guard_capture.outputs.artifact-name }}
          path: |
            ${{ steps.guard_capture.outputs.artifact-directory }}/guard.exe
            ${{ steps.guard_capture.outputs.artifact-directory }}/capture.json
            ${{ steps.guard_capture.outputs.artifact-directory }}/source-proof.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      - name: Record the server-assigned capture artifact
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ steps.guard_upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.guard_upload.outputs.artifact-digest }}
          ARTIFACT_NAME: ${{ steps.guard_capture.outputs.artifact-name }}
          CAPTURE_JOB_ID: ${{ steps.guard_capture.outputs.job-id }}
          CAPTURE_CHECK_RUN_ID: ${{ job.check_run_id }}
          GUARD_SHA256: ${{ steps.guard_capture.outputs.guard-sha256 }}
          CAPTURE_SHA256: ${{ steps.guard_capture.outputs.capture-sha256 }}
          SOURCE_MANIFEST_SHA256: ${{ steps.guard_capture.outputs.source-manifest-sha256 }}
          ATTESTATION_ID: ${{ steps.guard_attest.outputs.attestation-id }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($id in @($env:ARTIFACT_ID, $env:CAPTURE_JOB_ID, $env:CAPTURE_CHECK_RUN_ID)) {
            if ($id -notmatch '^[1-9][0-9]{0,18}$') { throw 'guard_artifact_server_id_missing' }
          }
          if ($env:ARTIFACT_DIGEST -notmatch '^[0-9a-f]{64}$') { throw 'guard_artifact_server_digest_missing' }
          if ($env:ATTESTATION_ID -notmatch '^[0-9A-Za-z_-]{1,128}$') { throw 'guard_attestation_id_missing' }
          $result = [ordered]@{
            domain = 'guard-gha-publication-v1'
            repository_id = [long]$env:GITHUB_REPOSITORY_ID
            source = '80c4ed5cbd864585f4894c6286d3d5c92194c1f5'
            source_tree = '84437789dfbe1bf1d56e4b96698b5c8da4a3dfb7'
            producer_revision = $env:GITHUB_SHA
            run_id = [long]$env:GITHUB_RUN_ID
            run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
            job_id = [long]$env:CAPTURE_JOB_ID
            check_run_id = [long]$env:CAPTURE_CHECK_RUN_ID
            artifact_id = [long]$env:ARTIFACT_ID
            artifact_name = $env:ARTIFACT_NAME
            archive_sha256 = $env:ARTIFACT_DIGEST
            output_sha256 = $env:GUARD_SHA256
            capture_sha256 = $env:CAPTURE_SHA256
            source_manifest_sha256 = $env:SOURCE_MANIFEST_SHA256
            attestation_id = $env:ATTESTATION_ID
          }
          $json = $result | ConvertTo-Json -Depth 4 -Compress
          if ([Text.Encoding]::UTF8.GetByteCount($json) -gt 8192) { throw 'guard_artifact_record_too_large' }
          Write-Output ('guard_gha_publication_v1=' + $json)
          [IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, 'guard_gha_publication_v1=' + $json + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
  guard-attestation-verifier:
    name: Guard attestation diagnostic (Windows)
    if: github.event_name != 'workflow_dispatch' && github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ toJSON(github.event.repository.private) == 'false' && 'windows-2025' || fromJSON('["self-hosted","Windows","X64","cc-pc-tools-windows"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/guard-attestation-verifier
        shell: pwsh
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOFLAGS: ""
      VERIFIER_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VERIFIER_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Admit current Windows source before checkout
        if: runner.environment == 'self-hosted'
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - name: Admit current hosted source before checkout
        if: runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          $branch = [Uri]::EscapeDataString($env:CI_BRANCH)
          $current = & gh api --method GET "repos/$env:CI_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($current.Trim() -ne $env:CI_SOURCE_SHA) { throw 'Source revision is no longer current' }
      - name: Check out the exact diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: "false"
          GIT_CONFIG_KEY_1: core.eol
          GIT_CONFIG_VALUE_1: lf
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go 1.27
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: 1.27.x
          cache: false
      - name: Verify and retain the committed dependency lock
        id: verifier_lock
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP ('guard-attestation-diagnostic/' + $env:GITHUB_RUN_ID + '/' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Path $destination -ErrorAction Stop | Out-Null
          $inputNames = @('main.go', 'main_test.go', 'actual_attestation_test.go', 'fixture_driver.go', 'go.mod', 'go.sum', 'README.md', 'actual-attestation.sigstore.json')
          $before = @($inputNames | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes((Join-Path (Get-Location).Path $_))
            [ordered]@{ path = $_; bytes = $bytes.Length; sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant() }
          })
          # Check the committed lock without modifying go.mod or go.sum.
          # A clean diff verifies module consistency, not update authority.
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $locks = @('go.mod', 'go.sum') | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes((Join-Path (Get-Location).Path $_))
            if ($bytes.Length -lt 1 -or $bytes.Length -gt 4MB) { throw 'verifier_dependency_lock_size_invalid' }
            $stream = [IO.File]::Open((Join-Path $destination $_), [IO.FileMode]::CreateNew, [IO.FileAccess]::Write, [IO.FileShare]::None)
            try { $stream.Write($bytes); $stream.Flush($true) } finally { $stream.Dispose() }
            [ordered]@{ path = $_; bytes = $bytes.Length; sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant() }
          }
          foreach ($lock in $locks) {
            $prior = @($before | Where-Object { $_.path -ceq $lock.path })
            if ($prior.Count -ne 1 -or $prior[0].bytes -ne $lock.bytes -or $prior[0].sha256 -cne $lock.sha256) { throw 'verifier_committed_lock_changed' }
          }
          $inputs = $before
          $record = [ordered]@{
            domain = 'guard-attestation-locked-check-v1'
            source_sha = $env:VERIFIER_SOURCE_SHA
            workflow_sha = $env:VERIFIER_WORKFLOW_SHA
            run_head_sha = $env:GITHUB_SHA
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            job = $env:GITHUB_JOB
            dependency_state = 'committed_lock_tidy_diff_clean'
            dependency_lock_final = $true
            update_authorized = $false
            before_inputs = $before
            verified_inputs = $inputs
          }
          $json = $record | ConvertTo-Json -Depth 8
          [IO.File]::WriteAllText((Join-Path $destination 'lock-manifest.json'), $json, [Text.UTF8Encoding]::new($false))
          [IO.File]::AppendAllText($env:GITHUB_ENV, 'GUARD_ATTESTATION_DIAGNOSTIC_DIR=' + $destination + [Environment]::NewLine)
      - name: Test signature, tuple and failure controls
        timeout-minutes: 4
        run: |
          go test -mod=readonly -count=1 -v -timeout 3m .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet -mod=readonly .
          exit $LASTEXITCODE
      - name: Build the diagnostic once
        timeout-minutes: 3
        run: |
          go build -mod=readonly -trimpath -o (Join-Path $env:GUARD_ATTESTATION_DIAGNOSTIC_DIR 'guard-attestation-verifier.exe') .
          exit $LASTEXITCODE
      - name: Run that binary against the embedded public bundle
        timeout-minutes: 3
        env:
          GUARD_ATTESTATION_DIAGNOSTIC_FIXTURE: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:GUARD_ATTESTATION_DIAGNOSTIC_DIR 'guard-attestation-verifier.exe'
          $lines = @(& $exe)
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }
          $text = $lines -join [Environment]::NewLine
          if ([Text.Encoding]::UTF8.GetByteCount($text) -gt 4096) { throw 'verifier_fixture_report_too_large' }
          $report = $text | ConvertFrom-Json -AsHashtable -ErrorAction Stop
          $expectedKeys = @('domain', 'signed_claims_verified', 'payload_bytes_verified', 'source_proof_validated', 'run_metadata_validated', 'update_authorized', 'reason')
          if ($report.Count -ne $expectedKeys.Count) { throw 'verifier_fixture_report_schema_invalid' }
          foreach ($key in $expectedKeys) {
            if (-not $report.ContainsKey($key)) { throw 'verifier_fixture_report_schema_invalid' }
          }
          if ($report.domain -cne 'guard-attestation-fixture-diagnostic-v1' -or $report.reason -cne 'signed_claims_verified_without_payload_or_update_authority' -or $report.signed_claims_verified -isnot [bool] -or $report.signed_claims_verified -ne $true) { throw 'verifier_fixture_claims_not_verified' }
          foreach ($key in @('payload_bytes_verified', 'source_proof_validated', 'run_metadata_validated', 'update_authorized')) {
            if ($report[$key] -isnot [bool] -or $report[$key] -ne $false) { throw 'verifier_fixture_overclaimed_authority' }
          }
          $binary = [IO.File]::ReadAllBytes($exe)
          $result = [ordered]@{
            domain = 'guard-attestation-diagnostic-observation-v1'
            source_sha = $env:VERIFIER_SOURCE_SHA
            executable_bytes = $binary.Length
            executable_sha256 = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($binary)).ToLowerInvariant()
            exit_code = $code
            report = $report
          }
          [IO.File]::WriteAllText((Join-Path $env:GUARD_ATTESTATION_DIAGNOSTIC_DIR 'fixture-report.json'), ($result | ConvertTo-Json -Depth 8), [Text.UTF8Encoding]::new($false))
          Write-Output $text
      - name: Confirm the captured module inputs stayed unchanged
        if: ${{ always() && steps.verifier_lock.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $record = Get-Content -LiteralPath (Join-Path $env:GUARD_ATTESTATION_DIAGNOSTIC_DIR 'lock-manifest.json') -Raw | ConvertFrom-Json
          foreach ($expected in $record.verified_inputs) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path (Get-Location).Path $expected.path))
            $sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
            if ($bytes.Length -ne $expected.bytes -or $sha -cne $expected.sha256) { throw 'verifier_captured_input_changed' }
          }
      - name: Retain the committed locks and available diagnostic output
        if: ${{ always() && steps.verifier_lock.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guard-attestation-locked-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GUARD_ATTESTATION_DIAGNOSTIC_DIR }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
