name: Linux runner finite probe
on:
  push:
    branches: [scheduler/todo-2511-pc-linux-runner-cargo-2510]
    paths: [.github/workflows/linux-runner-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, cc-pc-tools-linux, cc-pc-tools-linux-2511-proof]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify fixed revision and the shared Cargo admission
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "fixed-revision=$GITHUB_SHA"
          test "$(id -u)" = 1001
          test ! -e /var/run/docker.sock
          grep -E '^CapEff:[[:space:]]+0+$' /proc/self/status
          grep -E '^NoNewPrivs:[[:space:]]+1$' /proc/self/status
          test ! -e /dev/nvidiactl
          test ! -e /dev/dri
          assert_rejected() {
            local expected="$1" output
            shift
            if output=$("$@" 2>&1); then echo 'Forbidden request was accepted'; exit 1; fi
            printf '%s\n' "$output" | grep -F "$expected"
          }
          assert_rejected 'runner event rejected' env GITHUB_REPOSITORY=other/repo /opt/bridge/bridge hook
          assert_rejected 'bridge rejected (403)' env GITHUB_SHA=0000000000000000000000000000000000000000 /opt/bridge/bridge hook
          assert_rejected 'bridge rejected (403)' cargo test --config=build.jobs=64
          (cd /tmp && assert_rejected 'bridge rejected (403)' cargo test --locked)
          cargo --version
          cargo metadata --locked --format-version 1 --no-deps > /work/metadata.json
          cargo nextest run --locked -p cc-task-title --build-jobs 64 --test-threads 32
          cargo test --locked -p cc-task-title --doc
          cd tools/linux-runner-bridge
          go version
          mkdir -p /work/go-tmp /work/go-cache
          export GOTMPDIR=/work/go-tmp GOCACHE=/work/go-cache TMPDIR=/work/go-tmp GOMAXPROCS=2
          go test -p 2 -timeout 60s ./...
