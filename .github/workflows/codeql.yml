name: CodeQL PC
env:
  CC_LINUX_RUNNER_MODE: normal
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 22 * * 0'
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  analyze:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Standard Ubuntu is free for public repositories. Missing/private metadata
    # stays on the bounded PC runner rather than selecting billable hosting.
    runs-on: ${{ toJSON(github.event.repository.private) == 'false' && 'ubuntu-24.04' || fromJSON('["self-hosted","Linux","X64","cc-pc-tools-linux"]') }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      # PC jobs retain the host admission hook; hosted jobs make the same
      # current-head check before any repository source is checked out.
      - name: Admit current hosted source before checkout
        if: runner.environment == 'github-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_BRANCH: ${{ github.head_ref || github.ref_name }}
          CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=$(jq -rn --arg branch "$CI_BRANCH" '$branch | @uri')
          current=$(gh api --method GET "repos/$CI_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')
          test "$CI_SOURCE_SHA" = "$current"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: false
          # Keep query execution within the isolated runner's resource budget.
          threads: 2
          ram: 6144
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: '/language:${{ matrix.language }}'
