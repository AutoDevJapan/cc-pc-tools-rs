name: Owned download quarantine
on:
  push:
    branches: [main]
    paths: ['safe-delete-recovery/**', '.github/workflows/safe-delete-recovery.yml']
  pull_request:
    paths: ['safe-delete-recovery/**', '.github/workflows/safe-delete-recovery.yml']
# Superseded PR heads need no second verification; preserve every main run.
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
permissions:
  contents: read
jobs:
  recovery:
    if: github.repository == 'AutoDevJapan/cc-pc-tools-rs' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Windows, X64, cc-pc-tools-windows]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: safe-delete-recovery
    steps:
      - name: Admit current Windows source before checkout
        env:
          CI_JOB_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & $env:PC_CI_ADMISSION admit
          exit $LASTEXITCODE
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Create isolated CI fixtures
        shell: pwsh
        run: |
          # Git expands subst drives. Use a real owned directory in the service's
          # system temp instead, retaining the production 240-character limit.
          $helper = Join-Path $env:RUNNER_TEMP 'safe-delete-fixtures.exe'
          go -C ../safe-delete build -trimpath -o $helper .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $originalTemp = $env:TEMP
          $originalTmp = $env:TMP
          try {
            $env:TEMP = Join-Path $env:SystemRoot 'Temp'
            $env:TMP = $env:TEMP
            $created = & $helper create --project pc-ci --content recovery-fixtures | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not create owned physical fixtures' }
          } finally {
            $env:TEMP = $originalTemp
            $env:TMP = $originalTmp
          }
          $fixtures = $created.path
          "PC_CI_FIXTURE_ID=$($created.id)" >> $env:GITHUB_ENV
          "PC_CI_FIXTURE_PATH=$fixtures" >> $env:GITHUB_ENV
          "PC_CI_FIXTURE_HELPER=$helper" >> $env:GITHUB_ENV
          $guard = Join-Path $fixtures 'client-guard-fixture.exe'
          rustc tests/support/client_guard.rs -o $guard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SAFE_DELETE_TEST_ROOT=$fixtures" >> $env:GITHUB_ENV
          "SAFE_DELETE_TEST_GUARD=$guard" >> $env:GITHUB_ENV
      - run: cargo fmt --check
      - run: cargo nextest run --locked --workspace --test-threads 10
      - run: cargo test --locked --workspace --doc
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --target-dir target
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: safe-delete-recovery-windows
          retention-days: 3
          if-no-files-found: error
          path: |
            safe-delete-recovery/target/release/safe-delete-recovery.exe
            safe-delete-recovery/target/debug/deps/safe_delete_recovery-*.exe
      - name: Plan removal of this job's owned physical fixtures
        if: always() && env.PC_CI_FIXTURE_ID != ''
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:SystemRoot 'Temp'
          $env:TMP = $env:TEMP
          $plan = & $env:PC_CI_FIXTURE_HELPER plan --id $env:PC_CI_FIXTURE_ID | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $plan.action -ne 'submit_to_exec_tool' -or $plan.path -ne $env:PC_CI_FIXTURE_PATH) { throw 'Owned fixture deletion was not planned' }
          'PC_CI_FIXTURE_REMOVAL_PLANNED=1' >> $env:GITHUB_ENV
      - name: Remove the planned fixture and finish its ownership record
        if: always() && env.PC_CI_FIXTURE_REMOVAL_PLANNED == '1'
        shell: pwsh
        run: |
          $env:TEMP = Join-Path $env:SystemRoot 'Temp'
          $env:TMP = $env:TEMP
          $expected = Join-Path $env:TEMP "codex-owned-$env:PC_CI_FIXTURE_ID"
          if ($env:PC_CI_FIXTURE_ID -notmatch '^[a-f0-9]{32}$' -or $env:PC_CI_FIXTURE_PATH -ne $expected) { throw 'Unexpected fixture path' }
          Remove-Item -LiteralPath $expected -Recurse -ErrorAction Stop
          & $env:PC_CI_FIXTURE_HELPER finish --id $env:PC_CI_FIXTURE_ID
          if ($LASTEXITCODE -ne 0) { throw 'Owned fixture removal did not finish' }
