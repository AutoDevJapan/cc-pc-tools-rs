name: Chrome connection watch
on:
  push:
    branches: [main]
    paths: ['chrome-connection-watch/**', '.github/workflows/chrome-connection-watch.yml']
  pull_request:
    paths: ['chrome-connection-watch/**', '.github/workflows/chrome-connection-watch.yml']
# Superseded PR heads need no second verification; preserve every main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
        working-directory: chrome-connection-watch
      - run: go vet ./...
        working-directory: chrome-connection-watch
      - run: go build -ldflags '-H=windowsgui' -o chrome_connection_watch.exe .
        working-directory: chrome-connection-watch
