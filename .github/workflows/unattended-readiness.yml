name: Unattended readiness tools
on:
  push:
    branches: [main]
    paths: ['resident-guard/**', 'capacity-audit-3h/**', 'unattended-runner/**', 'repair-guard/**', '.github/workflows/unattended-readiness.yml']
  pull_request:
    paths: ['resident-guard/**', 'capacity-audit-3h/**', 'unattended-runner/**', 'repair-guard/**', '.github/workflows/unattended-readiness.yml']
permissions:
  contents: read
jobs:
  go:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        module: [resident-guard, capacity-audit-3h, unattended-runner]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath .
  repair-guard:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: repair-guard
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: repair-guard/go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath .
