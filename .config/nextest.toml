[profile.default]
test-threads = 10

[test-groups.process-boundary]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(cc-jobs) & (test(process_boundary_tests::) | test(cargo_) | test(end_to_end::) | binary(cargo_admission))'
test-group = 'process-boundary'

# These real Windows child-process tests assert short wall-clock lease deadlines.
# Share the existing process slot so unrelated process-boundary tests cannot
# delay their startup/cleanup past the command budget on a busy PC.
[[profile.default.overrides]]
filter = 'package(cc-live) & (test(running_child_yields_to_a_waiter_arriving_after_it_started) | test(quiet_running_child_is_not_cut_off_at_the_contention_lease) | test(departed_waiter_cancels_the_competition_deadline_during_a_running_child))'
test-group = 'process-boundary'

[[profile.default.overrides]]
filter = 'package(cc-ask) & binary(tick_bounds)'
threads-required = 'num-test-threads'

# A 200ms loopback deadline is measured against an unchanged 800ms bound.
# Keep VM scheduling and other process/network tests out of that measurement.
[[profile.default.overrides]]
filter = 'package(cc-ask) & binary(connect_timeout)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(chatgpt-web) & binary(fixtures)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(cc-scheduler) & test(real_child_process_has_no_console_window)'
threads-required = 'num-test-threads'

[[profile.default.overrides]]
filter = 'package(cc-ask) & test(busy_notifier_card_lock_returns_within_deadline_without_card_changes)'
threads-required = 'num-test-threads'
