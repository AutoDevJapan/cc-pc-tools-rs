<style>
#view-workload{--wl-bg:#101722;--wl-panel:#172231;--wl-line:#2b3a4d;--wl-text:#e7edf5;--wl-muted:#a5b4c7;--wl-accent:#73c5ad;color:var(--wl-text)}
#view-workload .wl-wrap{max-width:1180px;margin:0 auto;padding:20px clamp(14px,3vw,30px)}
#view-workload .wl-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
#view-workload h2,#view-workload h3{margin:0}
#view-workload h2{font-size:clamp(22px,3vw,30px)}
#view-workload h3{font-size:17px}
#view-workload .wl-controls{display:flex;align-items:center;gap:10px;color:var(--wl-muted)}
#view-workload input,#view-workload button{font:inherit;color:inherit}
#view-workload input[type=date]{background:#111b28;border:1px solid var(--wl-line);border-radius:8px;padding:8px 10px;color:var(--wl-text);min-height:40px}
#view-workload button{background:#1c2a39;border:1px solid var(--wl-line);border-radius:8px;padding:7px 11px;cursor:pointer;min-height:38px}
#view-workload button:hover,#view-workload button:focus-visible{border-color:var(--wl-accent);outline:2px solid transparent}
#view-workload a{color:#9edbc8;text-underline-offset:3px;overflow-wrap:anywhere}
#view-workload .wl-status{min-height:24px;margin:8px 0;color:var(--wl-muted);font-size:13px}
#view-workload .wl-status[data-kind=error]{color:#ffaca6}
#view-workload .wl-status[data-kind=stale]{color:#f1cb80}
#view-workload .wl-summary-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:14px 0 20px}
#view-workload .wl-project,#view-workload .wl-panel{background:var(--wl-panel);border:1px solid var(--wl-line);border-radius:12px;padding:16px}
#view-workload .wl-project h3{margin-bottom:8px}
#view-workload .wl-project ul{margin:0;padding-left:1.25rem;display:grid;gap:6px;color:#d4deea}
#view-workload .wl-empty{color:var(--wl-muted);margin:0}
#view-workload .wl-totals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:0 0 20px}
#view-workload .wl-total{background:var(--wl-panel);border:1px solid var(--wl-line);border-radius:12px;padding:14px 16px}
#view-workload .wl-total dt{color:var(--wl-muted);font-size:13px}
#view-workload .wl-total dd{margin:4px 0 0;font-size:clamp(20px,3vw,28px);font-weight:700;font-variant-numeric:tabular-nums}
#view-workload .wl-panels{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:14px}
#view-workload .wl-panel h3{margin-bottom:12px}
#view-workload .wl-details{margin-top:12px;border-top:1px solid var(--wl-line);padding-top:10px}
#view-workload .wl-details summary{cursor:pointer;color:#d4deea;font-weight:600}
#view-workload .wl-detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0;color:var(--wl-muted);font-size:13px}
#view-workload .wl-detail-grid b{color:var(--wl-text);font-variant-numeric:tabular-nums}
#view-workload .wl-results{padding-left:1.2rem;color:#d4deea}
#view-workload .wl-results li+li{margin-top:6px}
#view-workload .wl-timeline{list-style:none;margin:0;padding:0;display:grid;gap:7px;max-height:450px;overflow:auto}
#view-workload .wl-time-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;font-size:12px}
#view-workload .wl-time{color:var(--wl-muted);font-variant-numeric:tabular-nums}
#view-workload .wl-bars{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-height:22px}
#view-workload .wl-bar{display:inline-flex;align-items:center;gap:5px;background:#20372f;border:1px solid #36584c;border-radius:5px;padding:3px 6px;max-width:100%;color:#cfeee2}
#view-workload .wl-bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#view-workload .wl-bar b{font-variant-numeric:tabular-nums;white-space:nowrap}
#view-workload .wl-history{display:grid;gap:7px}
#view-workload .wl-history button{display:flex;justify-content:space-between;gap:8px;text-align:left;width:100%}
#view-workload .wl-history button[aria-current=date]{border-color:var(--wl-accent);background:#20372f}
#view-workload .wl-history small{color:var(--wl-muted)}
@media(max-width:720px){#view-workload .wl-panels{grid-template-columns:1fr}#view-workload .wl-totals{gap:7px}#view-workload .wl-total{padding:11px}#view-workload .wl-total dd{font-size:20px}}
@media(max-width:420px){#view-workload .wl-totals{grid-template-columns:1fr}#view-workload .wl-controls{width:100%;justify-content:space-between}}
</style>
<script>
(function(){
  'use strict';
  const ROOT='#view-workload';
  const API='/api/agent/workload';
  let timer=null, inFlight=false, lastData=null, selectedDate=null, controller=null, generation=0;
  const $=(selector,base=document)=>base.querySelector(selector);
  const root=()=>$(ROOT);
  function active(){const el=root();if(!el||el.hidden||el.getAttribute('aria-hidden')==='true')return false;const s=getComputedStyle(el);return s.display!=='none'&&s.visibility!=='hidden'&&el.getClientRects().length>0}
  function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!=null)n.textContent=String(text);return n}
  function status(message,kind='info'){let n=$('.wl-status');if(!n){const host=root();if(!host)return;n=el('p','wl-status');n.setAttribute('role','status');n.setAttribute('aria-live','polite');host.prepend(n)}n.textContent=message;n.dataset.kind=kind}
  function escText(value,fallback=''){return typeof value==='string'?value:fallback}
  function number(value){return typeof value==='number'&&Number.isFinite(value)&&value>=0?value:null}
  function hasMeasurement(data){return Boolean(data&&(data.measurement?['complete','partial'].includes(data.measurement.state):data.updated_at&&!data.collecting))}
  function count(value,suffix=''){const n=number(value);return n===null?'未計測':n.toLocaleString('ja-JP')+suffix}
  function duration(ms){const n=number(ms);return n===null?"未計測":n<60000?Math.floor(n/1000)+" 秒":n<3600000?(n/60000).toFixed(1)+" 分":(n/3600000).toFixed(1)+" 時間"}
  function githubUrl(value){if(typeof value!=='string')return null;try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='github.com'&&!u.username&&!u.password?u.href:null}catch(_){return null}}
  function appendSafeText(parent,text,url){const safe=githubUrl(url);if(safe){const a=el('a','',text);a.href=safe;a.target='_blank';a.rel='noopener noreferrer';parent.append(a)}else parent.append(document.createTextNode(text))}
  function preserveOpen(){const open=new Set();document.querySelectorAll(`${ROOT} details[data-project][open]`).forEach(d=>open.add(d.dataset.project));return open}
  function render(data){const host=root();if(!host)return;const opened=preserveOpen();lastData=data;host.replaceChildren();const wrap=el('div','wl-wrap');const head=el('div','wl-head');head.append(el('h2','',`作業状況 · ${escText(data.date,'日付不明')}`));const controls=el('div','wl-controls');controls.append(el('label','','日付'));const date=el('input');date.type='date';date.id='wl-date';date.value=/^\d{4}-\d{2}-\d{2}$/.test(data.date||'')?data.date:'';date.setAttribute('aria-label','表示する日付');controls.lastChild.htmlFor='wl-date';controls.append(date,el('button','','今日'));controls.lastChild.type='button';controls.lastChild.dataset.today='true';head.append(controls);wrap.append(head);
    const stat=el('p','wl-status');stat.setAttribute('role','status');stat.setAttribute('aria-live','polite');wrap.append(stat);
    if(!hasMeasurement(data)){wrap.append(el("p","wl-empty","仕事量は未取得です。観測できる作業を収集中です。"));host.append(wrap);status(Array.isArray(data.warnings)&&data.warnings.length?data.warnings.join(" / "):"まだ計測結果がありません。","stale");return}const projects=Array.isArray(data.projects)?data.projects:[];const summaries=el('div','wl-summary-list');summaries.setAttribute('aria-label','プロジェクトごとの作業概要');
    if(!projects.length)summaries.append(el('p','wl-empty','この日のプロジェクト作業はありません。'));
    for(const p of projects){const card=el('article','wl-project');card.append(el('h3','',escText(p.name,'名前なし')));card.append(el('p','wl-empty',`作業時間 ${duration(p.active_ms)} · ジョブ ${count(p.jobs,"件")} · マージ ${count(p.merged_prs,"件")}`));const list=el('ul');const rows=Array.isArray(p.summary)?p.summary.slice(0,5):[];for(const item of rows){const li=el('li');appendSafeText(li,escText(item&&item.text,'（要約なし）'),item&&item.url);list.append(li)}if(!rows.length)list.append(el('li','wl-empty','この日の作業要約はありません。'));card.append(list);summaries.append(card)}wrap.append(summaries);
    const totals=data.totals||{};const metrics=el('dl','wl-totals');for(const [label,value] of [[data.measurement&&data.measurement.kind==="processing_observations"?"観測した作業時間":"作業時間",duration(totals.active_ms)],[data.measurement&&data.measurement.kind==="processing_observations"?"観測したジョブ":"ジョブ数",count(totals.jobs," 件")],['マージ数',count(totals.merged_prs," 件")]]){const box=el('div','wl-total');box.append(el('dt','',label),el('dd','',value));metrics.append(box)}wrap.append(metrics);
    const panels=el('div','wl-panels');const timeline=el('section','wl-panel');timeline.setAttribute('aria-labelledby','wl-timeline-title');timeline.append(el('h3','','15分ごとの作業'));timeline.lastChild.id='wl-timeline-title';const points=Array.isArray(data.timeline)?data.timeline:[];const list=el('ol','wl-timeline');for(const point of points){const row=el('li','wl-time-row');row.append(el('time','wl-time',escText(point.time,'--:--')));const bars=el('div','wl-bars');for(const p of Array.isArray(point.projects)?point.projects:[]){const ms=number(p.active_ms);if(ms<=0)continue;const bar=el('div','wl-bar');appendSafeText(bar,escText(p.name,'名前なし'));bar.append(el('b','',`${Math.round(ms/60000)}分`));bars.append(bar)}if(!bars.childNodes.length)bars.append(el('span','wl-empty','作業なし'));row.append(bars);list.append(row)}if(!points.length)list.append(el('li','wl-empty','時間帯データはありません。'));timeline.append(list);panels.append(timeline);
    const history=el('section','wl-panel');history.setAttribute('aria-labelledby','wl-history-title');history.append(el('h3','','7日間の履歴'));history.lastChild.id='wl-history-title';const hist=el('div','wl-history');for(const day of (Array.isArray(data.history)?data.history:[]).slice(-7).reverse()){const b=el('button');b.type='button';b.dataset.historyDate=escText(day.date);b.setAttribute('aria-label',`${day.date}、作業時間 ${duration(day.active_ms)}、${count(day.jobs)} ジョブ`);if(day.date===data.date)b.setAttribute('aria-current','date');b.append(el('span','',escText(day.date,'日付不明')),el('small','',`${duration(day.active_ms)} · ${count(day.jobs)} 件`));hist.append(b)}if(!hist.childNodes.length)hist.append(el('p','wl-empty','履歴データはありません。'));history.append(hist);panels.append(history);wrap.append(panels);
    const detailHeading=el('h3','','作業の詳細');detailHeading.style.margin='22px 0 10px';wrap.append(detailHeading);for(const p of projects){const details=el('details','wl-details');details.dataset.project=escText(p.path,p.name);if(opened.has(details.dataset.project))details.open=true;const summary=el('summary','',`${escText(p.name,'名前なし')} の集計`);details.append(summary);const grid=el('div','wl-detail-grid');for(const [label,key] of [['作業時間','active_ms'],['ジョブ','jobs'],['実行時間（分）','run_ms'],['トークン','tokens'],['コミット','commits'],['マージ','merged_prs'],['完了ToDo','todos_done'],['ツール呼び出し','tool_calls']]){const item=el('span');item.append(document.createTextNode(`${label}: `),el('b','',key==='active_ms'?duration(p[key]):key==='run_ms'?number(p[key])===null?"未計測":(p[key]/60000).toFixed(1):count(p[key])));grid.append(item)}details.append(grid);const results=el('ul','wl-results');for(const result of (Array.isArray(p.results)?p.results:[])){const li=el('li');appendSafeText(li,escText(result.text,'（内容なし）'),result.url);results.append(li)}if(!results.childNodes.length)results.append(el('li','wl-empty','記録された結果はありません。'));details.append(results);wrap.append(details)}host.append(wrap);
    if(Array.isArray(data.warnings)&&data.warnings.length){stat.textContent=`注意: ${data.warnings.map(x=>String(x)).join(' / ')}`;stat.dataset.kind='stale'}else if(data.measurement&&data.measurement.state==="partial"){status("観測できた作業だけを集計しています。未観測の時間・トークン・成果は加算していません。","stale")}else if(data.collecting){status('集計中です。表示中の数値は後で更新されます。','stale')}else{const updated=Date.parse(data.updated_at||'');const stale=Number.isFinite(updated)&&Date.now()-updated>15*60*1000;status(stale?'最終更新から15分以上経過しています。表示内容が古い可能性があります。':`最終更新: ${escText(data.updated_at,'時刻不明')}`,stale?'stale':'info')}
  }
  function cancelWorkload(){generation++;if(controller)controller.abort();controller=null;inFlight=false}
  window.cancelWorkload=cancelWorkload;
  async function refreshWorkload(){const host=root();if(document.hidden||!active()||!host||inFlight)return;const date=selectedDate,url=API+(date?`?date=${encodeURIComponent(date)}`:''),epoch=generation,current=new AbortController(),timeout=setTimeout(()=>current.abort(),12000);controller=current;inFlight=true;if(!lastData)status('仕事量を読み込んでいます…');try{const response=await fetch(url,{signal:current.signal,headers:{Accept:'application/json'},cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const body=await response.json();if(epoch!==generation||current.signal.aborted)return;if(body.ok!==true||body.version!==1||!body.data||typeof body.data!=='object')throw new Error('API応答の形式が正しくありません');render(body.data)}catch(error){if(epoch===generation)status(`仕事量を取得できませんでした: ${error.name==='AbortError'?'接続が時間切れになりました。':error.message}${lastData?'（前回の表示を保持しています）':''}`,'error')}finally{clearTimeout(timeout);if(epoch===generation){inFlight=false;controller=null}}}
  window.refreshWorkload=refreshWorkload;
  function updateTimer(){if(!document.hidden&&active()){if(!timer)timer=window.setInterval(()=>{if(active())refreshWorkload()},60000)}else if(timer){clearInterval(timer);timer=null}}
  function bind(){const host=root();if(!host)return;host.addEventListener('change',event=>{if(event.target&&event.target.id==='wl-date'){selectedDate=event.target.value;cancelWorkload();refreshWorkload()}});host.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;if(button.dataset.historyDate){const input=$('#wl-date',host);if(input){input.value=button.dataset.historyDate;selectedDate=button.dataset.historyDate;cancelWorkload();refreshWorkload()}}else if(button.dataset.today){const input=$('#wl-date',host);if(input){const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const part=key=>parts.find(item=>item.type===key).value;input.value=`${part('year')}-${part('month')}-${part('day')}`;selectedDate=null;cancelWorkload();refreshWorkload()}}});window.addEventListener("console-view",()=>{if(!active())cancelWorkload();updateTimer()});document.addEventListener("visibilitychange",()=>{if(document.hidden)cancelWorkload();updateTimer()});window.addEventListener("pagehide",cancelWorkload);updateTimer();if(active())refreshWorkload()}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bind,{once:true});else bind();
})();
</script>
