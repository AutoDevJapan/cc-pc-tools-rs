name: Build speed
on:
  push:
    branches: [main]
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/build-speed.yml', '.config/nextest.toml']
  pull_request:
    paths: ['localai-web-rs/**', 'cc-jobs/**', 'cc-scheduler/**', 'cc-todo/**', 'cc-shepherd/**', 'cc-ask/**', 'cc-live/**', 'cc-local-llm/**', 'cc-chrome/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-redact/**', 'cc-gh-gate/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/build-speed.yml', '.config/nextest.toml']
permissions:
  contents: read
jobs:
  cc-jobs:
    # The cargo gate, its locks and the process tests are Windows only.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - uses: FedericoCarboni/setup-ffmpeg@v3
      - run: cargo nextest run --locked -p localai-web-rs -p cc-chrome -p cc-jobs -p cc-scheduler -p cc-job-policy -p cc-todo -p cc-shepherd -p cc-ask -p cc-redact -p cc-gh-gate --no-fail-fast --test-threads 10
      - run: cargo test --locked -p localai-web-rs -p cc-chrome -p cc-jobs -p cc-scheduler -p cc-job-policy -p cc-todo -p cc-shepherd -p cc-ask -p cc-redact -p cc-gh-gate --doc -- --test-threads=10
      - run: cargo clippy --locked -p localai-web-rs -p cc-chrome -p cc-jobs -p cc-scheduler -p cc-job-policy -p cc-todo -p cc-shepherd -p cc-ask -p cc-redact -p cc-gh-gate --all-targets -- -D warnings
