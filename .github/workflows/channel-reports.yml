name: Channel reports
on:
  push:
    branches: [main]
    paths: ['cc-ask/**', 'cc-channel-watch/**', 'cc-chrome/**', 'cc-live/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-local-llm/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/channel-reports.yml']
  pull_request:
    paths: ['cc-ask/**', 'cc-channel-watch/**', 'cc-chrome/**', 'cc-live/**', 'cc-job-policy/**', 'cc-task-title/**', 'cc-local-llm/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/channel-reports.yml']
# Superseded PR heads need no second verification; preserve every main run.
concurrency:
  group: ${{ github.workflow }}-pr-head-v2-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p cc-channel-watch
      - run: cargo test --locked -p cc-chrome -p cc-job-policy
      # cc-jobs uses Win32 handles and is validated on its supported platform.
      - if: runner.os == 'Windows'
        run: cargo test --locked -p cc-jobs --test parity registrar_launch_policy
      - run: cargo test --locked -p cc-ask --test channel_reports --test commands --test ask_dedup
      - run: cargo clippy --locked -p cc-ask -p cc-channel-watch -p cc-chrome -p cc-job-policy --all-targets -- -D warnings
