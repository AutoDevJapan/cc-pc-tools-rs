name: Skill documentation acceptance
on:
  pull_request:
    paths: ['docs/skills-3048-*', 'docs/skills-3080-*', 'tools/skills-3048-check/**', 'tools/skills-3080-catalog/**', 'tools/skills-3080-install/**', '.github/workflows/skills-3048.yml', '.gitattributes']
  push:
    branches: [main]
    paths: ['docs/skills-3048-*', 'docs/skills-3080-*', 'tools/skills-3048-check/**', 'tools/skills-3080-catalog/**', 'tools/skills-3080-install/**', '.github/workflows/skills-3048.yml', '.gitattributes']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}
jobs:
  documentation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: tools/skills-3048-check/go.mod
          cache: false
      - name: Check the validator and the finite source receipts
        run: go -C tools/skills-3048-check test -count=1 ./...
      - name: Vet the standalone documentation check
        run: go -C tools/skills-3048-check vet ./...
      - name: Check accounting on synthetic fixtures and fixed candidate receipts
        run: go -C tools/skills-3080-catalog test -count=1 ./...
      - name: Vet the metadata-only catalog triage
        run: go -C tools/skills-3080-catalog vet ./...
      - name: Check rendering and new-only installation with synthetic data
        run: go -C tools/skills-3080-install test -count=1 ./...
      - name: Vet the isolated public-source installer
        run: go -C tools/skills-3080-install vet ./...
