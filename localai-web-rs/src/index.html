
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Local AI Console</title>
  <style>
    :root{color-scheme:dark;--bg:#09101e;--panel:#111c30;--panel2:#0f172a;--line:#263650;--text:#e8eef8;--muted:#8fa1ba;--blue:#2563eb;--blue2:#60a5fa;--green:#34d399;--red:#fb7185;--amber:#fbbf24}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 70% -10%,#17325d 0,#09101e 42%);color:var(--text);font:14px/1.5 "Segoe UI","Yu Gothic UI",sans-serif;min-height:100vh}
     button,select,textarea,input{font:inherit} button{border:1px solid #2d4264;background:#17243b;color:var(--text);border-radius:9px;padding:9px 13px;cursor:pointer;transition:.15s ease}  button:hover{background:#263b5b;border-color:#4b6b99}  button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);border-color:#3b82f6;font-weight:700}.danger{background:#7f1d1d;border-color:#b91c1c}.ghost{background:transparent}
    .shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);background:rgba(9,16,30,.85);padding:22px 16px;display:flex;flex-direction:column;gap:18px}.brand{display:flex;gap:11px;align-items:center}.mark{width:38px;height:38px;border-radius:11px;background:#17325d;border:1px solid #2d5e9e;display:grid;place-items:center;color:#93c5fd;font-size:22px}.brand h1{font-size:17px;margin:0}.brand p{font-size:11px;color:var(--muted);margin:1px 0 0}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;border-color:transparent;color:#aab9cf}.nav button.active{background:#172b4a;color:#fff;border-color:#2d5e9e}.side-card{border:1px solid var(--line);background:rgba(17,28,48,.8);border-radius:12px;padding:12px}.side-card h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#91a8c7;margin:0 0 9px}.service-mini{display:flex;justify-content:space-between;gap:8px;color:#b9c7da;font-size:12px;padding:4px 0}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;background:#64748b;margin-right:6px}.dot.on{background:var(--green);box-shadow:0 0 10px #34d39966}.dot.off{background:var(--red)}.sidebar-footer{margin-top:auto;color:#64748b;font-size:11px}
    main{min-width:0;padding:22px 28px 26px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.topbar h2{margin:0;font-size:22px}.topbar p{margin:4px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.pill{border:1px solid #24527e;background:#11243a;border-radius:999px;padding:6px 11px;color:#a7f3d0;font-size:12px;white-space:nowrap}.view{display:none}.view.active{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.toolbar-left{display:flex;align-items:center;gap:8px}.toolbar label{color:var(--muted);font-size:12px}select,input,textarea{background:#0f172a;border:1px solid #2b3a53;border-radius:9px;color:var(--text);padding:10px}select{min-width:300px}textarea{width:100%;resize:vertical;min-height:90px;outline:none}textarea:focus,input:focus,select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px #60a5fa1c}
    .chat{display:grid;grid-template-rows:minmax(340px,1fr) auto auto;gap:12px;min-height:680px}.messages{border:1px solid var(--line);border-radius:14px;background:#0f172a;overflow:auto;padding:17px}.message{max-width:860px;margin:0 0 16px}.message .who{font-size:11px;color:#8fb6ee;margin-bottom:4px}.message .body{white-space:pre-wrap;color:#e8eef8}.message.system .body{color:#fda4af}.composer{border:1px solid var(--line);border-radius:14px;background:#111c30;padding:11px}.composer-head{color:var(--muted);font-size:12px;margin:0 0 5px}.composer-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:7px}.hint{color:#64748b;font-size:11px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:5px 9px;border-radius:999px}
    .hero{border:1px solid #2c5c96;background:#12233d;border-radius:14px;padding:17px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:14px}.hero h3{font-size:22px;margin:0}.hero p{color:#a8c7ef;margin:4px 0 0;font-size:12px}.job{text-align:right;color:#a7f3d0}.job small{display:block;color:#7fa7d8;font-size:10px;letter-spacing:.08em}.job strong{display:block;margin-top:3px}.shorts-bar{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px;margin-bottom:12px}.form-card{border:1px solid var(--line);background:#111c30;border-radius:12px;padding:11px;margin-bottom:12px}.form-card label{display:block;color:#cbd5e1;font-weight:600;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{border:1px solid var(--line);border-radius:10px;background:#111c30;padding:10px}.field label{font-size:12px;margin:0}.field small{display:block;color:#64748b;font-size:11px;margin-top:3px}.field input{width:100%;margin-top:7px;text-align:right}.mini-actions{display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-top:10px}.card-heading,.scene-board-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.card-heading strong,.scene-board-head strong{display:block;color:#e8eef8}.card-heading small,.scene-board-head small{display:block;color:#7f91aa;font-size:11px;margin-top:3px}.route-badge{border:1px solid #31527e;background:#14263f;border-radius:999px;color:#9fc7f6;font-size:11px;padding:4px 8px;white-space:nowrap}.scene-board-actions{display:flex;align-items:center;gap:8px;color:#8fa1ba;font-size:11px}.scene-list{display:grid;gap:10px}.scene-card{border:1px solid #2a3b57;background:#0d1728;border-radius:11px;padding:10px}.scene-card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}.scene-number{width:28px;height:28px;border-radius:8px;background:#1d3d68;color:#bfdbfe;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}.scene-title{flex:1;min-width:0}.scene-title input{width:100%;padding:7px 9px}.scene-remove{padding:6px 9px;color:#fda4af}.scene-grid{display:grid;grid-template-columns:minmax(170px,.75fr) minmax(0,1.25fr);gap:10px}.scene-media{border:1px dashed #38557c;border-radius:9px;padding:9px;min-height:118px;background:#101d32}.scene-media label{font-size:11px;margin-bottom:7px}.scene-media input[type=file]{width:100%;padding:7px;font-size:11px}.scene-media small{display:block;color:#7f91aa;font-size:10px;margin-top:6px;word-break:break-word}.scene-media.has-image{border-color:#2d8a6b;background:#10291f}.scene-prompt{min-height:92px}.scene-notes{margin-top:7px;width:100%;padding:7px 9px}.resolution-line{display:grid;grid-template-columns:auto minmax(90px,1fr) auto minmax(90px,1fr) auto 1fr;gap:8px;align-items:center;margin-top:10px}.resolution-line label{font-size:12px;color:#cbd5e1}.resolution-line input{width:100%}.resolution-line small{color:#64748b;font-size:10px}.resolution-line span:last-child{justify-self:end;color:#9fc7f6;font-size:11px}.load-check{display:flex!important;align-items:center;gap:7px;margin-top:11px!important;color:#9aaac0!important;font-size:12px;font-weight:400!important}.load-check input{accent-color:#3b82f6}.details{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px;background:#0f172a}.details summary{cursor:pointer;color:#cbd5e1}.details-grid{display:grid;grid-template-columns:130px 1fr auto;gap:8px;align-items:center;margin-top:10px}.details-grid label{font-size:12px;color:#cbd5e1}.details-grid input{width:100%}.history{border:1px solid var(--line);border-radius:10px;background:#0f172a;margin-bottom:11px}.history summary{padding:10px 11px;color:#cbd5e1;cursor:pointer}.history-list{padding:0 8px 8px;display:grid;gap:5px}.history-item{padding:8px 9px;border-radius:7px;color:#cbd5e1;background:#111c30;cursor:pointer;font-size:12px}.history-item:hover{background:#1d3150}.mini-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#64748b;font-size:11px}.mini-footer .actions{display:flex;gap:8px;flex-shrink:0}
    .character-board{background:linear-gradient(135deg,#111c30,#0d1728)}.character-actions{display:flex;align-items:center;gap:8px;color:#8fa1ba;font-size:11px}.character-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.character-card{display:flex;flex-direction:column;gap:5px;text-align:left;padding:7px;background:#0f1b2f;border:1px solid #2b3e5d;border-radius:10px;min-width:0}.character-card.selected{border-color:#60a5fa;background:#143258;box-shadow:0 0 0 2px #60a5fa26}.character-card img{width:100%;height:126px;object-fit:cover;object-position:center;border-radius:7px;background:#09101e}.character-card strong{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.character-card small{color:#7f91aa;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scene-cast{margin-top:9px}.scene-cast label{font-size:11px;margin-bottom:5px}.scene-cast select{width:100%;min-width:0;padding:6px;font-size:11px;min-height:76px}.scene-cast select option{padding:4px}.scene-media .media-list{display:grid;gap:3px;margin-top:6px;color:#91a8c7}.scene-media .media-list span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.scene-media .clear-media{margin-top:7px;padding:5px 8px;font-size:10px}.scene-ref-hint{color:#7f91aa;font-size:10px;margin-top:5px}.duration-note{color:#8fb6ee!important}.systems{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.system-card{border:1px solid var(--line);border-radius:12px;background:#111c30;padding:14px}.system-card h3{margin:0 0 4px;font-size:15px}.system-card p{margin:0;color:var(--muted);font-size:12px;min-height:36px}.system-card .status{margin:12px 0;color:#cbd5e1;font-size:12px}.system-card .actions{display:flex;gap:7px;flex-wrap:wrap}.toast{position:fixed;right:24px;bottom:22px;background:#16253e;border:1px solid #41618d;border-radius:10px;padding:10px 13px;box-shadow:0 12px 40px #0008;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid var(--line);padding:14px}.nav{grid-template-columns:repeat(3,1fr)}.side-card{display:none}main{padding:16px}.topbar{align-items:flex-start}.top-actions .pill{display:none}.chat{min-height:620px}.row,.shorts-bar,.scene-grid{grid-template-columns:1fr}.mini-footer{align-items:flex-start;flex-direction:column}.mini-footer .actions{width:100%}.mini-footer button{flex:1}.resolution-line{grid-template-columns:auto 1fr auto 1fr}.resolution-line small,.resolution-line span:last-child{grid-column:1/-1;justify-self:start}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="mark">✦</div><div><h1>Local AI Console</h1></div></div>
      <nav class="nav"><button data-view="kanban" class="active">Operations</button><a href="/progress" data-view="progress">作業進捗</a><button data-view="workload">仕事量</button><button data-view="systems">Systems</button><a href="/music" data-view="music">音楽制作 · Suno</a></nav>
    </aside>
    <main>
      <header class="topbar"><div><h2 id="page-title">Operations</h2><p id="page-subtitle">司令塔・部署・製品ごとの作業状況</p></div><div class="top-actions"><button class="ghost" id="refresh-btn">更新</button></div></header>

      <!-- console-music-view -->
      <section id="view-kanban" class="view active operations" aria-label="組織の作業状況">
        <div class="ops-toolbar">
          <div class="ops-update" id="ops-update" role="status">作業状況を読み込み中…</div>
          <div class="ops-filters"><label class="ops-search"><span class="ops-sr-only">製品・作業・担当・要約・工程・停止理由・次の行動・依存先を検索</span><input id="ops-search" type="search" placeholder="作業・要約・工程・停止・次・依存を検索" autocomplete="off"></label><label class="ops-sr-only" for="ops-status">作業の状態</label><select id="ops-status"><option value="">すべて</option><option value="working">● 実作業を確認</option><option value="unknown">実行未確認</option><option value="dependency_wait">依存待ち</option><option value="resource_wait">資源待ち</option><option value="decision_wait">本人回答待ち</option><option value="job_queued">ジョブ起動待ち</option><option value="intake_wait">受付待ち</option><option value="startup_failure">準備失敗</option><option value="recovery_unverified">復旧未確認</option><option value="waiting">● 待機</option><option value="attention">● 要対応</option><option value="idle">休止</option><option value="done">完了</option></select><button id="ops-refresh" class="ghost" type="button">更新</button></div>
        </div>
        <p id="ops-error" class="ops-error" role="status" hidden></p>
        <div id="ops-metrics" class="ops-metrics" aria-label="稼働状況とPCの使用量"></div>
        <div id="ops-commander" class="ops-command"></div>
        <div id="ops-departments" class="ops-departments"><p class="ops-empty">部署の状況を読み込み中…</p></div>
        <p id="ops-results" class="ops-note" role="status"></p>
        <details id="ops-unassigned" class="ops-sources" hidden><summary><span id="ops-unassigned-label">指定外の登録・所属の判断待ち</span> <span id="ops-unassigned-count"></span></summary><div id="ops-unassigned-list"></div></details>
        <details class="ops-sources"><summary>質問と回答を確認する</summary><section id="ops-questions" aria-label="Discordの質問と回答"><p>質問の送信を確認中です。</p></section></details>
        <details class="ops-sources"><summary>データの接続状況 <span id="ops-source-summary">未取得</span></summary><div id="ops-sources"></div><p id="ops-scope" class="ops-note"></p><p class="ops-note">進み具合は記録された実測値のみ表示します。未記録は「未記録」と表示します。</p></details>
      </section>
      <section id="view-progress" class="view operations" aria-label="作業進捗"><div class="ops-toolbar"><p id="progress-update" role="status">作業進捗は未取得です。</p><a href="/?view=kanban&amp;opsPanel=jobs">待機・履歴を確認</a></div><div id="progress-jobs"></div></section>
      <section id="view-workload" class="view" aria-label="仕事量"><p class="hint">仕事量を読み込み中…</p></section>
      <section id="view-systems" class="view" aria-label="ビルドとPCの負荷"><div id="systems-resources"><p role="status">ビルドとPCの負荷を取得しています…</p></div></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <dialog id="ops-dialog" class="ops-dialog" aria-labelledby="ops-dialog-title"><div class="ops-dialog-heading"><h3 id="ops-dialog-title">作業の詳細</h3><button type="button" id="ops-dialog-close" autofocus>閉じる</button></div><div id="ops-dialog-body"></div></dialog>
  <style>
.history-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 8px 8px}
/* Operations: department colors match cc-board; all counts come from the snapshot. */
.operations{--ops-line:#2b4563;--ops-muted:#a9bed6;line-break:strict;overflow-wrap:anywhere}
.ops-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.ops-toolbar,.ops-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ops-toolbar{justify-content:space-between;margin-bottom:16px}
.ops-update,.ops-note{color:var(--ops-muted);font-size:12px}
.ops-filters input{width:220px;max-width:100%;padding:8px 11px;background:#0b192a}
.ops-filters select{min-width:0;width:118px;padding:8px;background:#0b192a}
.ops-filters button{padding:8px 12px}
.ops-error{padding:12px;border:1px solid #935c37;background:#2c201a;color:#ffcf9c;border-radius:6px}
.ops-metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.ops-metric-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-column:span 2;gap:10px;min-width:0}
.ops-metric .ops-skills-meta{display:block;margin-top:3px;font-size:11px;color:var(--ops-muted)}
.ops-metric{padding:11px 16px;border:1px solid var(--ops-line);border-radius:6px;background:linear-gradient(145deg,#102137,#0b1829)}
.ops-metric span{display:block;font-size:12px;color:var(--ops-muted)}
.ops-metric strong{display:block;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:3px}
.ops-metric small{font-size:14px;color:#bbcee4;font-weight:400}
.ops-metric.attention strong{color:#ff8686}.ops-metric.waiting strong{color:#ffd065}
.ops-command{position:relative;display:flex;justify-content:center;padding:24px 0 30px}
.ops-command:after{content:'';position:absolute;bottom:0;left:50%;height:23px;width:1px;background:#597ea8}
.ops-commander{border:0;background:transparent;text-align:center;padding:0 20px;display:grid;justify-items:center;gap:3px;border-radius:6px}
.ops-commander:hover{background:#142740}
.ops-commander strong{font-size:17px}.ops-commander .ops-robot{width:62px;height:62px}
.ops-command-empty{color:var(--ops-muted);margin:0}
.ops-robot{display:block;width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 3px 1px #0006)}
.ops-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#bdcde0;white-space:nowrap}
.ops-status:before{content:'';width:9px;height:9px;border-radius:50%;background:#94a3b8;flex-shrink:0}
.ops-status.working:before{background:#41d889}.ops-status.waiting:before{background:#ffd065}.ops-status.attention:before{background:#ff7373}.ops-status.done:before{background:#7fbfff}
.ops-departments{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.ops-departments:before{content:'';position:absolute;left:16.66%;right:16.66%;top:-10px;height:10px;border-top:1px solid #597ea8;border-left:1px solid #597ea8;border-right:1px solid #597ea8;pointer-events:none}
.ops-department{min-width:0;background:linear-gradient(135deg,#0e2034,#0b1829);border:1px solid var(--ops-line);border-top:2px solid var(--dept-color);border-radius:7px;overflow:hidden}
.ops-department>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px;cursor:pointer;min-height:76px}
.ops-department>summary::-webkit-details-marker{display:none}
.ops-department>summary:after{content:'›';margin-left:auto;color:#a3c8f5;font-size:24px;transform:rotate(90deg)}
.ops-department:not([open])>summary:after{transform:none}
.ops-department>summary .ops-robot{width:48px;height:48px}
.ops-dept-title{min-width:0}.ops-dept-title strong{display:block;font-size:17px}.ops-dept-title small{display:block;color:#b3c8e0;font-size:12px;margin-top:3px}
.ops-products{display:grid;gap:10px;padding:0 10px 10px}
.ops-product{border:1px solid #2a4261;border-radius:5px;overflow:hidden;background:#0b192a}
.ops-product-heading{display:grid;grid-template-columns:36px minmax(0,1fr) max-content;align-items:center;gap:2px 9px;padding:9px 10px;background:#14253a;list-style:none;cursor:pointer;min-height:48px}
.ops-product-heading::-webkit-details-marker{display:none}
.ops-product-heading>.ops-robot{grid-column:1;grid-row:1/3}
.ops-product-heading:after{content:'›';grid-column:3;grid-row:1/3;color:#a3c8f5;font-size:20px}
.ops-product[open]>.ops-product-heading:after{transform:rotate(90deg)}
.ops-product-heading h4{grid-column:2;grid-row:1;margin:0;font-size:14px;min-width:0;overflow-wrap:anywhere}
.ops-product-heading>.ops-count{grid-column:2;grid-row:2;min-width:0;white-space:normal;overflow-wrap:anywhere}
.ops-count{font-size:12px;color:#c0d3ec;white-space:nowrap;font-variant-numeric:tabular-nums}
.ops-worker{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;border:0;border-top:1px solid #263c57;border-radius:0;background:transparent;text-align:left;padding:10px 9px;min-height:65px}
.ops-worker:hover{background:#19314e}.ops-worker[aria-current=true]{background:#172f4d;box-shadow:inset 0 0 0 1px #65a9ff}
.ops-worker .ops-robot{width:32px;height:32px}
.ops-worker-text{min-width:0}.ops-worker-text strong{display:block;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ops-worker-text small{display:block;color:#b1c6de;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ops-worker-meta{display:grid;justify-items:end;gap:6px}
.ops-worker-facts{grid-column:1/-1;display:grid;gap:5px;min-width:0;font-size:13px;color:#c8d7e8;white-space:normal;overflow-wrap:anywhere}.ops-worker-facts>span{display:block;min-width:0}.ops-worker-facts b{font-weight:600;color:#e1e9ee}
.ops-progress{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;font-size:11px;color:#c6dbf5}
.ops-progress progress{appearance:none;width:62px;height:8px;border:0;border-radius:2px;background:#1b2e47;overflow:hidden}
.ops-progress progress::-webkit-progress-bar{background:#1b2e47}.ops-progress progress::-webkit-progress-value{background:#64a7fa;border-radius:2px}.ops-progress progress::-moz-progress-bar{background:#64a7fa}
.ops-progress .ops-progress-value{min-width:30px;text-align:right}
.ops-unmeasured{color:#b0c0d5;font-size:11px}
.ops-empty{color:var(--ops-muted);padding:16px;margin:0;font-size:12px}

      host.querySelectorAll('[data-progress-key]').forEach(button=>button.onclick=()=>openOpsDetail(button.dataset.progressKey,button));
    }
    function switchView(view,{historyMode='push',focus=false}={}){if(!['kanban','progress','workload','systems','music'].includes(view)||(view==='music'&&!$('#view-music')))view='kanban';const currentUrl=new URL(location.href),currentView=currentUrl.pathname==='/progress'?'progress':currentUrl.searchParams.get('view')||(currentUrl.pathname.startsWith('/music')?'music':'kanban');if(historyMode==='push'&&currentView===view){refreshCurrentPage();if(focus){$('#page-title').tabIndex=-1;$('#page-title').focus()}return}cancelPageFetches(view);$$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${view}`));$$('.nav [data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('#page-title').textContent=({kanban:'Operations',progress:'作業進捗',workload:'仕事量',systems:'Systems',music:'音楽制作 · Suno'})[view];$('#page-subtitle').textContent=({kanban:'司令塔・部署・製品ごとの作業状況',progress:'現在の作業',workload:'日付ごとの作業',systems:'ビルドとPCの負荷',music:'曲の下書きと生成候補'})[view];if(historyMode!=='none'){const url=new URL(location.href);if(view==='progress'){url.pathname='/progress';url.search=''}else{if(url.pathname==='/progress')url.pathname='/';url.searchParams.set('view',view);url.searchParams.delete('opsStatus');url.searchParams.delete('opsSearch');url.searchParams.delete('opsPanel')}if(String(url)!==location.href)history[historyMode==='replace'?'replaceState':'pushState']({},'',url)}if(view==='music'&&window.loadConsoleMusic)window.loadConsoleMusic();refreshCurrentPage();if(focus){$('#page-title').tabIndex=-1;$('#page-title').focus()}window.dispatchEvent(new CustomEvent('console-view',{detail:{view}}))}
    window.addEventListener('popstate',()=>switchView(new URL(location.href).pathname==='/progress'?'progress':new URL(location.href).searchParams.get('view')||(new URL(location.href).pathname.startsWith('/music')?'music':'kanban'),{historyMode:'none'}));
    function cancelPageFetches(next){if(!["kanban","progress"].includes(next)&&opsState.controller){const controller=opsState.controller;opsState.controller=null;controller.abort()}cancelOpsDetail();if(next!=="systems"&&healthController){const controller=healthController;healthController=null;controller.abort()}if(next!=="systems"&&window.cancelResources)window.cancelResources();if(next!=="workload"&&window.cancelWorkload)window.cancelWorkload();if(next!=="music"){if(window.cancelConsoleMusic)window.cancelConsoleMusic();if(typeof next==="string")document.querySelectorAll("#view-music audio").forEach(audio=>audio.pause())}if(typeof next==="string"&&typeof closeOpsDetail==="function")closeOpsDetail()}
    function refreshCurrentPage(){if(document.hidden)return;if($('#view-kanban').classList.contains('active')||$('#view-progress').classList.contains('active')){refreshOperations();renderProgress()}else if($('#view-systems').classList.contains('active'))refresh();else if($('#view-workload').classList.contains('active')&&window.refreshWorkload)window.refreshWorkload();else if($('#view-music').classList.contains('active')&&window.loadConsoleMusic)window.loadConsoleMusic()}
    $$('.nav [data-view]').forEach(button=>button.onclick=event=>{if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;event.preventDefault();switchView(button.dataset.view,{focus:true})});
    $('#refresh-btn').onclick=()=>{if($('#view-music').classList.contains('active')&&window.loadConsoleMusic)window.loadConsoleMusic({force:true});else refreshCurrentPage()};$('#ops-refresh').onclick=()=>refreshOperations({force:true});
    switchView(new URL(location.href).pathname==='/progress'?'progress':new URL(location.href).searchParams.get('view')||(location.pathname.startsWith('/music')?'music':'kanban'),{historyMode:'none'});
    setInterval(()=>{if(document.hidden)return;if($('#view-kanban').classList.contains('active')||$('#view-progress').classList.contains('active')){refreshOperations();renderProgress()}else if($('#view-systems').classList.contains('active'))refresh()},15000);
    document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelPageFetches();else refreshCurrentPage()});window.addEventListener('pagehide',cancelPageFetches);
  </script>
</body>
</html>
