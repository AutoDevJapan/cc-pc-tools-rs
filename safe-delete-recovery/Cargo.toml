[package]
name = "safe-delete-recovery"
version = "0.1.0"
edition = "2024"

# Windows recovery has a dedicated fixture root and client-guard CI stub.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.dev]
debug = 0

[profile.release]
strip = true
